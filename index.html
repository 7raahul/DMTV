<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieBase — Movies & TV Shows</title>

<style>
:root{
  --bg:#080a0e;
  --panel:#10141a;
  --panel2:#151a21;
  --panel3:#1a2028;
  --line:#282e38;
  --text:#f5f7fa;
  --muted:#9299a6;
  --accent:#e7ff4f;
  --accentText:#101300;
  --danger:#ff6479;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body.modal-open{
  overflow:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

img{
  max-width:100%;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:64px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 28px;
  background:rgba(8,10,14,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(16px);
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:-.6px;
  white-space:nowrap;
}

.logo span{
  color:var(--accent);
}

.search{
  flex:1;
  max-width:600px;
  margin:auto;
}

.search input{
  width:100%;
  height:42px;
  padding:0 15px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#0d1117;
  color:white;
  outline:none;
}

.search input:focus{
  border-color:#626a77;
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-btn{
  width:42px;
  height:42px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#11161c;
  color:white;
}

/* =========================================================
   MAIN
========================================================= */

main{
  width:min(1440px,100%);
  margin:auto;
  padding:25px 28px 90px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:15px;
  margin:28px 0 14px;
}

.section-title h2{
  margin:0;
  font-size:22px;
  letter-spacing:-.3px;
}

.section-title p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px;
}

/* =========================================================
   TRENDING RECOMMENDATIONS
========================================================= */

.trending-box{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:330px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
}

.trending-info{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:32px;
}

.trending-badge{
  display:inline-flex;
  width:max-content;
  padding:6px 10px;
  border-radius:7px;
  background:rgba(231,255,79,.10);
  color:var(--accent);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.trending-info h1{
  margin:12px 0 9px;
  font-size:clamp(25px,3vw,43px);
  line-height:1.02;
  letter-spacing:-1.4px;
}

.trending-meta{
  display:flex;
  flex-wrap:wrap;
  gap:11px;
  color:#d0d5dd;
  font-size:12px;
}

.trending-rating{
  color:var(--accent);
  font-weight:900;
}

.trending-overview{
  max-width:650px;
  margin:15px 0 0;
  color:var(--muted);
  line-height:1.6;
  font-size:13px;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:4;
  overflow:hidden;
}

.trending-image{
  min-width:0;
  min-height:330px;
  overflow:hidden;
  background:#07090c;
}

.trending-image img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
}

.trending-click{
  cursor:pointer;
}

.trending-nav{
  position:absolute;
  right:16px;
  bottom:15px;
  z-index:5;
  display:flex;
  gap:7px;
}

.trending-nav button{
  width:38px;
  height:34px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.20);
  background:rgba(8,10,14,.82);
  color:white;
  backdrop-filter:blur(8px);
}

.trending-nav button:hover{
  background:var(--accent);
  color:var(--accentText);
}

/* =========================================================
   BROWSE BY
========================================================= */

.browse-box{
  padding:11px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
}

.browse-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.browse-label{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  margin-right:4px;
}

.filter-select{
  height:37px;
  min-width:125px;
  padding:0 30px 0 11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel2);
  color:#f1f3f6;
  outline:none;
  appearance:auto;
  font-size:12px;
  font-weight:750;
}

.filter-select:focus{
  border-color:#646d79;
}

.apply-btn{
  height:37px;
  padding:0 15px;
  border:1px solid var(--accent);
  border-radius:8px;
  background:var(--accent);
  color:var(--accentText);
  font-size:12px;
  font-weight:900;
}

.apply-btn:hover{
  filter:brightness(.95);
}

/* =========================================================
   RESULTS
========================================================= */

.results-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin:28px 0 14px;
}

.results-head h2{
  margin:0;
  font-size:20px;
}

.results-count{
  color:var(--muted);
  font-size:11px;
}

.movie-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:16px;
}

.card{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--panel);
  cursor:pointer;
  transition:transform .16s ease,border-color .16s ease;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#48505c;
}

.poster{
  aspect-ratio:2/3;
  overflow:hidden;
  background:#171b21;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.card-info{
  padding:10px;
}

.card-title{
  font-size:13px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:6px;
  color:var(--muted);
  font-size:10px;
}

.rating{
  color:var(--accent);
  font-weight:900;
}

/* =========================================================
   PAGINATION
========================================================= */

.pagination{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:28px 0 10px;
}

.pagination button{
  min-width:40px;
  height:37px;
  padding:0 11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel);
  color:white;
  font-size:12px;
}

.pagination button:hover:not(:disabled),
.pagination button.active{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--accentText);
}

.pagination button:disabled{
  opacity:.3;
  cursor:not-allowed;
}

.pagination-dots{
  color:#737a85;
}

/* =========================================================
   RANDOM PICKER
========================================================= */

.random-overlay{
  position:fixed;
  inset:0;
  z-index:500;
  background:#07090d;
  overflow:auto;
}

.random-page{
  min-height:100%;
}

.random-header{
  position:sticky;
  top:0;
  z-index:2;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  background:#090c10;
  border-bottom:1px solid var(--line);
}

.random-header h2{
  margin:0;
  font-size:21px;
}

.random-close{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel2);
  color:white;
  font-size:20px;
}

.random-body{
  width:min(900px,calc(100% - 32px));
  margin:auto;
  padding:35px 0 70px;
}

.random-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.random-field{
  padding:14px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--panel);
}

.random-field label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.random-field select{
  width:100%;
  height:42px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel2);
  color:white;
  outline:none;
}

.random-action{
  width:100%;
  height:46px;
  margin-top:17px;
  border:0;
  border-radius:9px;
  background:var(--accent);
  color:var(--accentText);
  font-weight:950;
}

.random-result{
  display:none;
  margin-top:20px;
  grid-template-columns:220px 1fr;
  gap:22px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  cursor:pointer;
}

.random-result.show{
  display:grid;
}

.random-poster{
  aspect-ratio:2/3;
  overflow:hidden;
  border-radius:10px;
  background:#171b21;
}

.random-poster img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.random-content{
  align-self:center;
}

.random-content h3{
  margin:8px 0;
  font-size:29px;
}

.random-content p{
  color:var(--muted);
  line-height:1.6;
}

/* =========================================================
   DETAILS PAGE
========================================================= */

.details-overlay{
  position:fixed;
  inset:0;
  z-index:450;
  overflow:auto;
  background:#07090d;
}

.details-page{
  min-height:100%;
}

.details-backdrop{
  position:relative;
  height:min(58vh,560px);
  min-height:360px;
  overflow:hidden;
  background:#080a0d;
}

.details-backdrop img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
}

.details-backdrop:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(7,9,13,.94),rgba(7,9,13,.42),rgba(7,9,13,.06)),
    linear-gradient(0deg,#07090d,transparent 45%);
}

.close-details{
  position:absolute;
  right:26px;
  top:22px;
  z-index:5;
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;
  background:rgba(7,9,13,.76);
  color:white;
  font-size:20px;
}

.details-content{
  position:relative;
  z-index:4;
  width:min(1400px,100%);
  margin:-105px auto 0;
  padding:0 28px 75px;
}

.details-main{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  gap:28px;
  align-items:end;
}

.details-poster{
  aspect-ratio:2/3;
  overflow:hidden;
  border:1px solid #353b45;
  border-radius:13px;
  background:#11151b;
}

.details-poster img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.details-info{
  min-width:0;
  padding-bottom:8px;
}

.details-type{
  color:var(--accent);
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.details-info h1{
  margin:8px 0 10px;
  font-size:clamp(30px,5vw,58px);
  line-height:1;
  letter-spacing:-1.7px;
}

.details-meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  color:#d0d5dc;
  font-size:12px;
}

.details-rating{
  margin-top:11px;
  color:var(--accent);
  font-weight:900;
}

.details-overview{
  max-width:850px;
  margin:14px 0;
  color:#aeb4bd;
  font-size:13px;
  line-height:1.65;
}

.details-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.details-actions button{
  height:39px;
  padding:0 13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#11161c;
  color:white;
  font-size:11px;
  font-weight:850;
}

.details-actions button.primary{
  border-color:var(--accent);
  background:var(--accent);
  color:var(--accentText);
}

/* providers */

.providers{
  margin-top:20px;
}

.providers-title{
  margin-bottom:8px;
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.provider-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.provider{
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#11161c;
  font-size:10px;
}

.provider img{
  width:25px;
  height:25px;
  border-radius:6px;
  object-fit:cover;
}

/* seasons */

.seasons-section,
.cast-section,
.related-section,
.timeline-section{
  margin-top:38px;
}

.season-select{
  width:220px;
  height:41px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel2);
  color:white;
  outline:none;
}

.episodes{
  display:grid;
  gap:10px;
  margin-top:13px;
}

.episode{
  display:grid;
  grid-template-columns:155px minmax(0,1fr) auto;
  align-items:center;
  gap:14px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
}

.episode-thumb{
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:7px;
  background:#171b21;
}

.episode-thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.episode h4{
  margin:0 0 5px;
  font-size:13px;
}

.episode p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

/* cast */

.cast-grid{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:7px;
}

.cast-card{
  flex:0 0 110px;
}

.cast-photo{
  width:110px;
  height:145px;
  overflow:hidden;
  border-radius:9px;
  background:#151a20;
}

.cast-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cast-name{
  margin-top:7px;
  font-size:11px;
  font-weight:850;
}

.cast-character{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

/* related */

.related-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px;
}

/* =========================================================
   TIMELINE
========================================================= */

.timeline{
  position:relative;
  margin-top:15px;
  padding-left:25px;
}

.timeline:before{
  content:"";
  position:absolute;
  left:8px;
  top:0;
  bottom:0;
  width:1px;
  background:var(--line);
}

.timeline-item{
  position:relative;
  display:grid;
  grid-template-columns:85px 1fr;
  gap:16px;
  margin-bottom:18px;
}

.timeline-dot{
  position:absolute;
  left:-21px;
  top:15px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px #07090d;
}

.timeline-date{
  padding-top:10px;
  color:var(--muted);
  font-size:10px;
  font-weight:850;
}

.timeline-card{
  display:flex;
  gap:12px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
  cursor:pointer;
}

.timeline-poster{
  width:54px;
  height:80px;
  flex:none;
  overflow:hidden;
  border-radius:6px;
  background:#171b21;
}

.timeline-poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.timeline-info{
  align-self:center;
}

.timeline-info h4{
  margin:0 0 6px;
  font-size:13px;
}

.timeline-badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:5px;
  background:#171c22;
  color:#c9ced6;
  font-size:9px;
  font-weight:850;
}

/* =========================================================
   DATE DIALOG
========================================================= */

.date-overlay{
  position:fixed;
  inset:0;
  z-index:700;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(0,0,0,.78);
}

.date-dialog{
  width:min(380px,100%);
  padding:20px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#11161c;
}

.date-dialog h3{
  margin:0 0 14px;
  font-size:18px;
}

.date-input{
  width:100%;
  height:43px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#181d24;
  color:white;
  padding:0 10px;
}

.date-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:14px;
}

.date-actions button{
  height:37px;
  padding:0 13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#171c22;
  color:white;
}

.date-actions .ok{
  border-color:var(--accent);
  background:var(--accent);
  color:var(--accentText);
  font-weight:900;
}

/* =========================================================
   TOAST / TOP
========================================================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:800;
  padding:11px 14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#12171e;
  color:white;
  font-size:12px;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

.to-top{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:90;
  width:43px;
  height:43px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#12171e;
  color:white;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.to-top.show{
  opacity:1;
  pointer-events:auto;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1150px){

  .movie-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .related-grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }

}

@media(max-width:800px){

  .header{
    padding:0 14px;
    gap:9px;
  }

  .logo{
    font-size:17px;
  }

  .header-actions{
    display:none;
  }

  main{
    padding:18px 14px 75px;
  }

  /*
    Keep Trending as half information / half backdrop
    on mobile as requested.
  */
  .trending-box{
    grid-template-columns:1fr 1fr;
    min-height:245px;
    border-radius:13px;
  }

  .trending-info{
    padding:17px;
  }

  .trending-info h1{
    font-size:23px;
  }

  .trending-overview{
    font-size:10px;
    -webkit-line-clamp:3;
  }

  .trending-meta{
    gap:6px;
    font-size:10px;
  }

  .trending-image{
    min-height:245px;
  }

  .movie-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }

  .random-options{
    grid-template-columns:1fr;
  }

  .random-result{
    grid-template-columns:130px 1fr;
  }

  .random-content h3{
    font-size:21px;
  }

  .details-backdrop{
    height:330px;
    min-height:280px;
  }

  .details-content{
    margin:-65px auto 0;
    padding:0 14px 55px;
  }

  .details-main{
    grid-template-columns:115px minmax(0,1fr);
    gap:15px;
  }

  .details-info h1{
    font-size:28px;
  }

  .details-overview{

<script>
"use strict";

/* =========================================================
   TMDB CONFIG
========================================================= */

const API_KEY =
  "9c95420163879f1c4726c540b305cbc6";

const API_BASE =
  "https://api.themoviedb.org/3";

const IMG_BASE =
  "https://image.tmdb.org/t/p/";

const POSTER =
  IMG_BASE + "w500";

const BACKDROP =
  IMG_BASE + "original";

const EPISODE_IMAGE =
  IMG_BASE + "w780";

const PROFILE =
  IMG_BASE + "w185";

const PROVIDER_IMAGE =
  IMG_BASE + "w92";

/* =========================================================
   STATE
========================================================= */

const state = {

  page:1,

  /*
    We fetch enough TMDB pages to make a local 50-item page.
  */
  pageSize:50,

  totalPages:1,

  items:[],

  currentDetails:null,

  trending:[],

  trendIndex:0,

  trendTimer:null,

  genreMap:{
    movie:new Map(),
    tv:new Map()
  },

  /*
    Prevents repeated titles inside the currently rendered
    result page.
  */
  renderedKeys:new Set(),

  filters:{
    year:"",
    popularity:"any",
    genre:"",
    type:"all"
  }

};

/* =========================================================
   DOM
========================================================= */

const $ = id =>
  document.getElementById(id);

/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function mediaType(item){

  return item.media_type ||
    (
      item.first_air_date
        ? "tv"
        : "movie"
    );

}

function titleOf(item){

  return item.title ||
    item.name ||
    "Untitled";

}

function releaseDateOf(item){

  return item.release_date ||
    item.first_air_date ||
    "";

}

function yearOf(item){

  const date =
    releaseDateOf(item);

  return date
    ? date.slice(0,4)
    : "—";

}

function ratingOf(item){

  return Number(
    item.vote_average || 0
  ).toFixed(1);

}

function showToast(message){

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },2200);

}

async function api(path,params={}){

  const url =
    new URL(
      API_BASE + path
    );

  url.searchParams.set(
    "api_key",
    API_KEY
  );

  url.searchParams.set(
    "language",
    "en-US"
  );

  Object.entries(params)
    .forEach(([key,value])=>{

      if(
        value !== undefined &&
        value !== null &&
        value !== ""
      ){

        url.searchParams.set(
          key,
          value
        );

      }

    });

  const response =
    await fetch(url);

  if(!response.ok){

    throw new Error(
      "TMDB API request failed"
    );

  }

  return response.json();

}

function setModalOpen(value){

  document.body.classList.toggle(
    "modal-open",
    value
  );

}

/* =========================================================
   STORAGE
========================================================= */

function readStorage(key){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(key) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch{

    return [];

  }

}

function writeStorage(key,data){

  localStorage.setItem(
    key,
    JSON.stringify(data)
  );

}

/* =========================================================
   YEARS
========================================================= */

function loadYears(){

  const select =
    $("yearSelect");

  const current =
    new Date().getFullYear();

  for(
    let year=current;
    year>=1970;
    year--
  ){

    const option =
      document.createElement("option");

    option.value =
      year;

    option.textContent =
      year;

    select.appendChild(
      option
    );

  }

}

/* =========================================================
   GENRES
========================================================= */

async function loadGenres(){

  try{

    const [
      movieGenres,
      tvGenres
    ] =
      await Promise.all([
        api("/genre/movie/list"),
        api("/genre/tv/list")
      ]);

    movieGenres.genres.forEach(
      genre=>{
        state.genreMap.movie.set(
          genre.id,
          genre.name
        );
      }
    );

    tvGenres.genres.forEach(
      genre=>{
        state.genreMap.tv.set(
          genre.id,
          genre.name
        );
      }
    );

    const combined =
      new Map();

    movieGenres.genres.forEach(
      genre=>{
        combined.set(
          genre.id,
          genre.name
        );
      }
    );

    tvGenres.genres.forEach(
      genre=>{
        combined.set(
          genre.id,
          genre.name
        );
      }
    );

    const selects = [
      $("genreSelect"),
      $("randomGenre")
    ];

    selects.forEach(select=>{

      [...combined.entries()]
        .sort(
          (a,b)=>
            a[1].localeCompare(b[1])
        )
        .forEach(
          ([id,name])=>{

            const option =
              document.createElement(
                "option"
              );

            option.value =
              id;

            option.textContent =
              name;

            select.appendChild(
              option
            );

          }
        );

      /*
        Bollywood is deliberately included as a separate
        option rather than pretending TMDB has a "Bollywood"
        genre ID.
      */

      const bollywood =
        document.createElement(
          "option"
        );

      bollywood.value =
        "bollywood";

      bollywood.textContent =
        "Bollywood";

      select.appendChild(
        bollywood
      );

    });

  }catch(error){

    console.error(
      "Genre error:",
      error
    );

  }

}

/* =========================================================
   TRENDING
========================================================= */

async function loadTrending(){

  try{

    const data =
      await api(
        "/trending/all/week"
      );

    state.trending =
      (data.results || [])
        .filter(
          item=>
            (
              item.media_type==="movie" ||
              item.media_type==="tv"
            ) &&
            (
              item.backdrop_path ||
              item.poster_path
            )
        )
        .slice(0,20);

    state.trendIndex=0;

    renderTrending();

    /*
      Automatically change every 4 seconds.
    */
    clearInterval(
      state.trendTimer
    );

    state.trendTimer =
      setInterval(
        nextTrending,
        4000
      );

  }catch(error){

    console.error(
      "Trending error:",
      error
    );

  }

}

function renderTrending(){

  if(!state.trending.length)
    return;

  const item =
    state.trending[
      state.trendIndex
    ];

  const type =
    mediaType(item);

  const typeText =
    type==="tv"
      ? "TV Show"
      : "Movie";

  const date =
    releaseDateOf(item);

  $("trendingInfo").innerHTML = `

    <span class="trending-badge">
      ${typeText}
    </span>

    <h1>
      ${esc(titleOf(item))}
    </h1>

    <div class="trending-meta">

      <span>
        Release: ${esc(
          date || "Unavailable"
        )}
      </span>

      <span class="trending-rating">
        ★ ${ratingOf(item)}
      </span>

    </div>

    <p class="trending-overview">
      ${esc(
        item.overview ||
        "No overview available."
      )}
    </p>

  `;

  const image =
    $("trendingImage");

  image.src =
    item.backdrop_path
      ? BACKDROP + item.backdrop_path
      : IMG_BASE + "w1280" + item.poster_path;

  image.alt =
    titleOf(item);

}

function nextTrending(){

  if(!state.trending.length)
    return;

  state.trendIndex =
    (
      state.trendIndex + 1
    ) %
    state.trending.length;

  renderTrending();

}

function previousTrending(){

  if(!state.trending.length)
    return;

  state.trendIndex =
    (
      state.trendIndex -
      1 +
      state.trending.length
    ) %
    state.trending.length;

  renderTrending();

}

$("trendNext")
  .addEventListener(
    "click",
    event=>{
      event.stopPropagation();
      nextTrending();
    }
  );

$("trendPrev")
  .addEventListener(
    "click",
    event=>{
      event.stopPropagation();
      previousTrending();
    }
  );

function openTrendingDetails(){

  if(!state.trending.length)
    return;

  const item =
    state.trending[
      state.trendIndex
    ];

  openDetails(
    item.id,
    mediaType(item)
  );

}

$("trendingInfo")
  .addEventListener(
    "click",
    openTrendingDetails
  );

$("trendingImageBox")
  .addEventListener(
    "click",
    openTrendingDetails
  );

/* =========================================================
   FILTERS
========================================================= */

function getFilters(){

  return {

    year:
      $("yearSelect").value,

    popularity:
      $("popularSelect").value,

    genre:
      $("genreSelect").value,

    type:
      $("typeSelect").value

  };

}

$("applyFilters")
  .addEventListener(
    "click",
    ()=>{

      state.filters =
        getFilters();

      state.page=1;

      discoverPage(1);

    }
  );

/* =========================================================
   DISCOVER QUERY
========================================================= */

function discoverParams(
  type,
  page,
  filters
){

  const params = {

    page,

    include_adult:false,

    include_video:false,

    sort_by:
      filters.popularity==="all"
        ? "popularity.desc"
        : "popularity.desc"

  };

  if(filters.year){

    if(type==="movie"){

      params.primary_release_year =
        filters.year;

    }else{

      params.first_air_date_year =
        filters.year;

    }

  }

  if(
    filters.genre &&
    filters.genre!=="bollywood"
  ){

    params.with_genres =
      filters.genre;

  }

  if(
    filters.genre==="bollywood"
  ){

    params.with_original_language =
      "hi";

    params.region =
      "IN";

  }

  return params;

}

/* =========================================================
   FETCH A FULL 50-ITEM PAGE
========================================================= */

async function fetchFiftyMovies(
  type,
  logicalPage,
  filters
){

  /*
    Each TMDB page contains 20 results.

    To make our own 50-item page:
    page 1 => TMDB 1,2,3
    page 2 => TMDB 4,5,6
    etc.

    This gives 60 raw results, then we keep 50 unique.
  */

  const start =
    (logicalPage-1)*3 + 1;

  const requests = [
    start,
    start+1,
    start+2
  ].map(
    tmdbPage =>
      api(
        type==="movie"
          ? "/discover/movie"
          : "/discover/tv",
        discoverParams(
          type,
          tmdbPage,
          filters
        )
      )
  );

  const responses =
    await Promise.all(
      requests
    );

  const all=[];

  responses.forEach(
    response=>{

      (response.results || [])
        .forEach(item=>{

          all.push({
            ...item,
            media_type:type
          });

        });

    }
  );

  const unique=[];
  const keys=new Set();

  all.forEach(item=>{

    const key =
      `${type}-${item.id}`;

    if(!keys.has(key)){

      keys.add(key);

      unique.push(item);

    }

  });

  return {

    results:
      unique.slice(0,50),

    sourceTotalPages:
      Math.max(
        ...responses.map(
          r=>r.total_pages || 1
        )
      )

  };

}

/* =========================================================
   DISCOVER PAGE
========================================================= */

async function discoverPage(page=1){

  const filters =
    state.filters;

  state.page=page;

  $("resultsGrid").innerHTML = `
    <div style="
      grid-column:1/-1;
      padding:55px;
      text-align:center;
      color:#9299a6">
      Loading...
    </div>
  `;

  $("pagination").innerHTML="";

  try{

    let items=[];
    let totalPages=1;

    if(filters.type==="all"){

      /*
        Fetch 50 movies + 50 TV.
        Merge, dedupe and sort.
        Final page remains maximum 50 items.
      */

      const [
        movies,
        tv
      ] =
        await Promise.all([

          fetchFiftyMovies(
            "movie",
            page,
            filters
          ),

          fetchFiftyMovies(
            "tv",
            page,
            filters
          )

        ]);

      const merged =
        [
          ...movies.results,
          ...tv.results
        ];

      const unique=[];
      const keys=new Set();

      merged.forEach(item=>{

        const key =
          `${mediaType(item)}-${item.id}`;

        if(!keys.has(key)){

          keys.add(key);

          unique.push(item);

        }

      });

      unique.sort(
        (a,b)=>
          (b.popularity || 0) -
          (a.popularity || 0)
      );

      items =
        unique.slice(0,50);

      totalPages =
        Math.max(
          movies.sourceTotalPages,
          tv.sourceTotalPages
        );

      /*
        Since one local page consumes 3 TMDB pages,
        local page count is reduced accordingly.
      */

      totalPages =
        Math.max(
          1,
          Math.ceil(
            totalPages / 3
          )
        );

    }else{

      const result =
        await fetchFiftyMovies(
          filters.type,
          page,
          filters
        );

      items =
        result.results;

      totalPages =
        Math.max(
          1,
          Math.ceil(
            result.sourceTotalPages / 3
          )
        );

    }

    /*
      Hard cap to TMDB's practical discover range.
    */
    state.totalPages =
      Math.min(
        totalPages,
        500
      );

    state.items =
      items;

    renderResults();

    renderPagination();

  }catch(error){

    console.error(
      "Discover error:",
      error
    );

    $("resultsGrid").innerHTML = `
      <div style="
        grid-column:1/-1;
        padding:55px;
        text-align:center;
        color:#ff7183">
        Unable to load titles.
        Please check your internet connection
        or TMDB API key.
      </div>
    `;

  }

}

/* =========================================================
   RESULTS
========================================================= */

function resultCard(item){

  const type =
    mediaType(item);

  const title =
    titleOf(item);

  const poster =
    item.poster_path
      ? POSTER + item.poster_path
      : "";

  return `

    <article
      class="card"
      data-id="${item.id}"
      data-type="${type}">

      <div class="poster">

        ${
          poster
            ? `
              <img
                loading="lazy"
                src="${poster}"
                alt="${esc(title)}">
            `
            : `
              <div style="
                height:100%;
                display:grid;
                place-items:center;
                color:#727985;
                font-size:11px">
                No Poster
              </div>
            `
        }

      </div>

      <div class="card-info">

        <div class="card-title">
          ${esc(title)}
        </div>

        <div class="card-meta">

          <span>
            ${esc(yearOf(item))}
          </span>

          <span class="rating">
            ★ ${ratingOf(item)}
          </span>

        </div>

      </div>

    </article>

  `;

}

function renderResults(){

  const grid =
    $("resultsGrid");

  const unique=[];
  const keys=new Set();

  state.items.forEach(item=>{

    const key =
      `${mediaType(item)}-${item.id}`;

    if(!keys.has(key)){

      keys.add(key);

      unique.push(item);

    }

  });

  state.renderedKeys =
    keys;

  if(!unique.length){

    grid.innerHTML = `
      <div style="
        grid-column:1/-1;
        padding:55px;
        text-align:center;
        color:#9299a6">
        No titles found.
      </div>
    `;

    $("resultsCount").textContent =
      "0 results";

    return;

  }

  grid.innerHTML =
    unique
      .map(resultCard)
      .join("");

  grid
    .querySelectorAll(".card")
    .forEach(card=>{

      card.addEventListener(
        "click",
        ()=>{

          openDetails(
            Number(
              card.dataset.id
            ),
            card.dataset.type
          );

        }
      );

    });

  $("resultsCount").textContent =
    `${unique.length} results`;

  $("resultsTitle").textContent =
    state.filters.type==="movie"
      ? "Movies"
      : state.filters.type==="tv"
      ? "TV Shows"
      : "Movies & TV Shows";

}

/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(){

  const container =
    $("pagination");

  const total =
    state.totalPages;

  const current =
    state.page;

  if(total<=1){

    container.innerHTML="";

    return;

  }

  const pages=[];
  const addPage =
    page=>{

      if(
        page>=1 &&
        page<=total &&
        !pages.includes(page)
      ){

        pages.push(page);

      }

    };

  addPage(1);

  for(
    let p=current-2;
    p<=current+2;
    p++
  ){

    addPage(p);

  }

  addPage(total);

  pages.sort(
    (a,b)=>a-b
  );

  let html = `

    <button
      data-page="${current-1}"
      ${current===1?"disabled":""}>
      Back
    </button>

  `;

  let previous=0;

  pages.forEach(page=>{

    if(
      previous &&
      page-previous>1
    ){

      html += `
        <span class="pagination-dots">
          …
        </span>
      `;

    }

    html += `
      <button
        class="${page===current?"active":""}"
        data-page="${page}">
        ${page}
      </button>
    `;

    previous=page;

  });

  html += `

    <button
      data-page="${current+1}"
      ${current===total?"disabled":""}>
      Next
    </button>

  `;

  container.innerHTML =
    html;

  container
    .querySelectorAll(
      "button:not(:disabled)"
    )
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{

          const page =
            Number(
              button.dataset.page
            );

          if(
            page<1 ||
            page>total
          )
            return;

          discoverPage(page);

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }
      );

    });

}

async function openDetails(
  id,
  type
){

  $("detailsOverlay")
    .classList
    .remove("hidden");

  setModalOpen(true);

  $("detailsOverlay").innerHTML = `
    <div style="
      min-height:100vh;
      display:grid;
      place-items:center;
      color:#9299a6">
      Loading...
    </div>
  `;

  try{

    const details =
      await api(
        `/${type}/${id}`,
        {
          append_to_response:
            "credits,external_ids"
        }
      );

    state.currentDetails = {
      ...details,
      media_type:type
    };

    renderDetails(
      details,
      type
    );

    /*
      Load related content separately so the main details
      screen does not wait for every secondary request.
    */

    loadRelated(
      details,
      type
    );

    /*
      Providers are loaded separately.
    */

    loadProviders(
      details.id,
      type
    );

  }catch(error){

    console.error(
      "Details error:",
      error
    );

    $("detailsOverlay").innerHTML = `
      <div style="
        min-height:100vh;
        display:grid;
        place-items:center;
        text-align:center">
        <div>
          Unable to load details.
          <br><br>
          <button
            onclick="closeDetails()"
            style="
              padding:10px 15px;
              border-radius:8px;
              border:1px solid #282e38;
              background:#151a21;
              color:white">
            Close
          </button>
        </div>
      </div>
    `;

  }

}

function closeDetails(){

  $("detailsOverlay")
    .classList
    .add("hidden");

  $("detailsOverlay").innerHTML="";

  setModalOpen(false);

}

window.closeDetails =

async function loadProviders(
  id,
  type
){

  const container =
    $("providers");

  if(!container)
    return;

  try{

    const data =
      await api(
        `/${type}/${id}/watch/providers`
      );

    const country =
      data.results?.IN ||
      data.results?.US ||
      Object.values(
        data.results || {}
      )[0];

    if(!country){

      container.innerHTML="";

      return;

    }

    const providers=[];

    [
      ...(country.flatrate || []),
      ...(country.free || []),
      ...(country.ads || [])
    ].forEach(provider=>{

      if(
        !providers.some(
          x=>x.provider_id===
            provider.provider_id
        )
      ){

        providers.push(
          provider
        );

      }

    });

    if(!providers.length){

      container.innerHTML="";

      return;

    }

    container.innerHTML = `

      <div class="providers-title">
        Available On
      </div>

      <div class="provider-row">

        ${
          providers
            .slice(0,10)
            .map(provider=>`

              <div
                class="provider"
                title="${esc(provider.provider_name)}">

                ${
                  provider.logo_path
                    ? `
                      <img
                        src="${PROVIDER_IMAGE + provider.logo_path}"
                        alt="${esc(provider.provider_name)}">
                    `
                    : ""
                }

                <span>
                  ${esc(
                    provider.provider_name
                  )}
                </span>

              </div>

            `)
            .join("")
        }

      </div>

    `;

  }catch(error){

    console.error(
      "Provider error:",
      error
    );

  }

}

/* =========================================================
   RELATED / FRANCHISE
========================================================= */

async function loadRelated(
  item,
  type
){

  const grid =
    $("relatedGrid");

  if(!grid)
    return;

  grid.innerHTML = `
    <div style="
      grid-column:1/-1;
      padding:15px;
      color:#9299a6">
      Loading...
    </div>
  `;

  try{

    let items=[];

    if(type==="movie"){

      const recommendationData =
        await api(
          `/movie/${item.id}/recommendations`
        );

      items.push(
        ...(recommendationData.results || [])
      );

      /*
        Add collection/franchise titles.
      */

      if(
        item.belongs_to_collection?.id
      ){

        const collection =
          await api(
            `/collection/${item.belongs_to_collection.id}`
          );

        items.push(
          ...(collection.parts || [])
        );

      }

    }else{

      const recommendationData =
        await api(
          `/tv/${item.id}/recommendations`
        );

      items.push(
        ...(recommendationData.results || [])
      );

    }

    const unique=[];
    const keys=new Set();

    items.forEach(
      related=>{

        const key =
          `${type}-${related.id}`;

        if(
          related.id!==item.id &&
          !keys.has(key) &&
          related.poster_path
        ){

          keys.add(key);

          unique.push({
            ...related,
            media_type:type
          });

        }

      }
    );

    if(!unique.length){

      grid.innerHTML="";

      return;

    }

    grid.innerHTML =
      unique
        .slice(0,12)
        .map(resultCard)
        .join("");

    grid
      .querySelectorAll(".card")
      .forEach(card=>{

        card.addEventListener(
          "click",
          ()=>{

            openDetails(
              Number(
                card.dataset.id
              ),
              card.dataset.type
            );

          }
        );

      });

  }catch(error){

    console.error(
      "Related error:",
      error
    );

    grid.innerHTML="";

  }

}

          timestamp:

function renderTimeline(){

  const container =
    $("timeline");

  const watched =
    readStorage(
      "watched"
    ).map(item=>({
      ...item,
      status:"Watched"
    }));

  const scheduled =
    readStorage(
      "scheduled"
    ).map(item=>({
      ...item,
      status:"Scheduled"
    }));

  const combined =
    [
      ...watched,
      ...scheduled
    ].sort(
      (a,b)=>
        String(b.date)
          .localeCompare(
            String(a.date)
          )
    );

  if(!combined.length){

    container.innerHTML = `
      <div style="
        padding:20px;
        border:1px solid #282e38;

        color:#9299a6;

async function getRandomPool(
  type,
  genre,
  popularity
){

  const params={

    page:
      Math.floor(
        Math.random()*5
      )+1,

    include_adult:false,

    include_video:false,

    sort_by:
      popularity==="all"
        ? "popularity.desc"
        : "popularity.desc"

  };

  if(
    genre &&
    genre!=="bollywood"
  ){

    params.with_genres =
      genre;

  }

  if(
    genre==="bollywood"
  ){

    params.with_original_language =
      "hi";

    params.region =
      "IN";

  }

  const data =
    await api(
      type==="movie"
        ? "/discover/movie"
        : "/discover/tv",
      params
    );

  return (data.results || [])
    .filter(
      item=>item.poster_path
    )
    .map(
      item=>({
        ...item,
        media_type:type
      })
    );

}

async function pickRandom(){

  const type =
    $("randomType").value;

  const popularity =
    $("randomPopularity").value;

  const genre =
    $("randomGenre").value;

  const result =
    $("randomResult");

  result.classList.remove(
    "show"
  );

  try{

    const types =
      type==="all"
        ? ["movie","tv"]
        : [type];

    let pool=[];

    /*
      Run both selected media types.
    */

    for(
      const currentType of types
    ){

      try{

        const items =
          await getRandomPool(
            currentType,
            genre,
            popularity
          );

        pool.push(
          ...items
        );

      }catch(error){

        console.error(
          "Random type error:",
          error
        );

      }

    }

    /*
      Bollywood fallback.
    */

    if(
      !pool.length &&
      genre==="bollywood"
    ){

      for(
        const currentType of types
      ){

        const data =
          await api(
            currentType==="movie"
              ? "/discover/movie"
              : "/discover/tv",
            {
              page:1,
              include_adult:false,
              with_original_language:"hi",
              sort_by:"popularity.desc"
            }
          );

        pool.push(
          ...(data.results || [])
            .filter(
              item=>item.poster_path
            )
            .map(
              item=>({
                ...item,
                media_type:
                  currentType
              })
            )
        );

      }

    }

    /*
      Dedupe random pool.
    */

    const unique=[];
    const keys=new Set();

    pool.forEach(item=>{

      const key =
        `${item.media_type}-${item.id}`;

      if(!keys.has(key)){

        keys.add(key);

        unique.push(item);

      }

    });

    if(!unique.length){

      showToast(
        "No matching title found."
      );

      return;

    }

    const item =
      unique[
        Math.floor(
          Math.random() *
          unique.length
        )
      ];

    $("randomPoster").src =
      POSTER +
      item.poster_path;

    $("randomPoster").alt =
      titleOf(item);

    $("randomTypeText")
      .textContent =
        item.media_type==="tv"
          ? "TV Show"
          : "Movie";

    $("randomTitle")
      .textContent =
        titleOf(item);

    $("randomMeta").innerHTML = `

      <span>
        Release:
        ${esc(
          releaseDateOf(item) ||
          "Unavailable"
        )}
      </span>

      <span class="rating">
        ★ ${ratingOf(item)}
      </span>

    `;

    $("randomOverview")
      .textContent =
        item.overview ||
        "No overview available.";

    result.classList.add(
      "show"
    );

    /*
      Entire result area is clickable.
      No need for a separate View Details button.
    */

    result.onclick=()=>{

      closeRandom();

      openDetails(
        item.id,
        item.media_type
      );

    };

  }catch(error){

    console.error(
      "Random error:",
      error
    );

    showToast(
      "Unable to pick a title."
    );

  }

}

$("pickRandom")
  .addEventListener(
    "click",
    pickRandom
  );

let searchTimer=null;

$("searchInput")
  .addEventListener(

async function performSearch(
  query
){

  $("resultsGrid").innerHTML = `
    <div style="
      grid-column:1/-1;
      padding:50px;
      text-align:center;
      color:#9299a6">
      Searching...
    </div>
  `;

  $("pagination")
    .innerHTML="";

  try{

    const data =
      await api(
        "/search/multi",
        {
          query,
          page:1,
          include_adult:false
        }
      );

    const unique=[];
    const keys=new Set();

    (data.results || [])
      .forEach(item=>{

        if(
          item.media_type!=="movie" &&
          item.media_type!=="tv"
        )
          return;

        const key =
          `${item.media_type}-${item.id}`;

        if(!keys.has(key)){

          keys.add(key);

          unique.push(item);

        }

      });

    /*
      Search screen is also capped at 50.
    */

    state.items =
      unique.slice(0,50);

    state.page=1;

    state.totalPages =
      Math.min(
        Math.max(
          1,
          Math.ceil(
            (data.total_results || 0) /
            50
          )
        ),
        500
      );

    renderResults();

    /*
      Search pagination is represented as local
      50-result pages. Additional search pages are
      fetched when the user navigates.
    */

    renderSearchPagination(
      query
    );

  }catch(error){

    console.error(
      "Search error:",
      error
    );

  }

}

function renderSearchPagination(
  query
){

  const container =
    $("pagination");

  const total =
    state.totalPages;

  if(total<=1){

    container.innerHTML="";

    return;

  }

  const current =
    state.page;

  let html = `

    <button
      data-search-page="${current-1}"
      ${current===1?"disabled":""}>
      Back
    </button>

  `;

  const pages=[];

  pages.push(1);

  for(
    let p=current-2;
    p<=current+2;
    p++
  ){

    if(
      p>1 &&
      p<total
    )
      pages.push(p);

  }

  if(total>1)
    pages.push(total);

  const sorted=[
    ...new Set(pages)
  ].sort(
    (a,b)=>a-b
  );

  let previous=0;

  sorted.forEach(page=>{

    if(
      previous &&
      page-previous>1
    ){

      html += `
        <span class="pagination-dots">
          …
        </span>
      `;

    }

    html += `
      <button
        class="${page===current?"active":""}"
        data-search-page="${page}">
        ${page}
      </button>
    `;

    previous=page;

  });

  html += `

    <button
      data-search-page="${current+1}"
      ${current===total?"disabled":""}>
      Next
    </button>

  `;

  container.innerHTML =
    html;

  container
    .querySelectorAll(
      "button:not(:disabled)"
    )
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{

          const page =
            Number(
              button.dataset.searchPage
            );

          if(
            page<1 ||
            page>total
          )
            return;

          searchPage(
            query,
            page
          );

        }
      );

    });

}

async function searchPage(
  query,
  page
){

  try{

    const start =
      (page-1)*3+1;

    const requests=[
      start,
      start+1,
      start+2
    ].map(
      tmdbPage=>
        api(
          "/search/multi",
          {
            query,
            page:tmdbPage,
            include_adult:false
          }
        )
    );

    const responses =
      await Promise.all(
        requests
      );

    const unique=[];
    const keys=new Set();

    responses.forEach(
      response=>{

        (response.results || [])
          .forEach(item=>{

            if(
              item.media_type!=="movie" &&
              item.media_type!=="tv"
            )
              return;

            const key =
              `${item.media_type}-${item.id}`;

            if(!keys.has(key)){

              keys.add(key);

              unique.push(item);

            }

          });

      }
    );

    state.items =
      unique.slice(0,50);

    state.page=page;

    renderResults();

    renderSearchPagination(
      query
    );

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }catch(error){

    console.error(
      "Search page error:",
      error
    );

  }

}
