<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WatchVault — Movies & TV Shows</title>

<style>
:root{
  --bg:#06111b;
  --bg2:#0a1824;
  --panel:#0d1b28;
  --panel2:#101f2d;
  --line:#20384c;
  --text:#eef5fb;
  --muted:#91a8bb;
  --green:#32d583;
  --yellow:#f5c518;
  --blue:#45a3ff;
  --danger:#ff6677;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 15% 0%,rgba(30,100,120,.13),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(30,60,130,.10),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  display:block;
  max-width:100%;
}

.hidden{
  display:none!important;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(5,15,24,.93);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  width:min(1500px,calc(100% - 32px));
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.7px;
  white-space:nowrap;
}

.logo span{
  color:var(--yellow);
}

.search{
  width:360px;
  margin-left:auto;
  position:relative;
}

.search input{
  width:100%;
  height:45px;
  padding:0 44px 0 16px;
  color:var(--text);
  background:#091622;
  border:1px solid var(--line);
  border-radius:24px;
  outline:none;
}

.search input:focus{
  border-color:#49657b;
}

.search-icon{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.nav{
  display:flex;
  gap:9px;
}

.nav-btn{
  border:1px solid var(--line);
  background:#0a1824;
  color:var(--text);
  border-radius:25px;
  padding:11px 17px;
  font-weight:800;
  transition:.2s;
}

.nav-btn:hover,
.nav-btn.active{
  border-color:#48657b;
  background:#132536;
}

.nav-btn.random{
  color:#fff;
}

/* ================= MAIN ================= */

.container{
  width:min(1500px,calc(100% - 32px));
  margin:auto;
}

main{
  padding:24px 0 80px;
}

/* ================= TRENDING ================= */

.section-title{
  margin:0 0 7px;
  font-size:27px;
  letter-spacing:-.5px;
}

.section-subtitle{
  color:var(--muted);
  margin:0 0 18px;
}

.trending-box{
  position:relative;
  height:340px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:22px;
  background:#091620;
  box-shadow:var(--shadow);
  margin-bottom:28px;
}

.trending-backdrop{
  position:absolute;
  inset:0 0 0 50%;
  overflow:hidden;
}

.trending-backdrop::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    #091620 0%,
    rgba(9,22,32,.78) 12%,
    rgba(9,22,32,.18) 75%,
    rgba(9,22,32,.1)
  );
}

.trending-backdrop img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.trending-info{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:52%;
  padding:42px 45px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  z-index:2;
  cursor:pointer;
}

.trending-label{
  color:var(--green);
  text-transform:uppercase;
  font-size:13px;
  letter-spacing:2px;
  font-weight:900;
  margin-bottom:10px;
}

.trending-title{
  font-size:clamp(32px,4vw,58px);
  line-height:1;
  letter-spacing:-2px;
  margin:0 0 15px;
}

.trending-meta{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  color:#dbe8f2;
}

.meta-chip{
  background:rgba(8,23,34,.88);
  border:1px solid #284357;
  padding:7px 11px;
  border-radius:9px;
  font-size:14px;
}

.rating{
  color:var(--yellow);
  font-weight:900;
}

.trending-controls{
  position:absolute;
  right:22px;
  bottom:18px;
  z-index:5;
  display:flex;
  gap:8px;
}

.circle-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid #385166;
  color:#fff;
  background:rgba(7,19,29,.86);
  display:grid;
  place-items:center;
}

.circle-btn:hover{
  background:#172c3d;
}

/* ================= BROWSE ================= */

.browse-wrap{
  margin-bottom:34px;
}

.browse-bar{
  display:flex;
  align-items:stretch;
  border:1px solid var(--line);
  border-radius:16px;
  background:#0b1926;
  overflow:visible;
  position:relative;
  z-index:50;
}

.browse-label{
  padding:17px 19px;
  font-size:14px;
  font-weight:900;
  letter-spacing:1.5px;
  color:#8da6ba;
  display:flex;
  align-items:center;
  white-space:nowrap;
  border-right:1px solid var(--line);
}

.filter{
  position:relative;
  min-width:145px;
  border-right:1px solid var(--line);
}

.filter.large{
  min-width:190px;
}

.filter-button{
  width:100%;
  height:56px;
  border:0;
  background:transparent;
  color:var(--text);
  padding:0 17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:850;
  text-transform:uppercase;
  font-size:14px;
  letter-spacing:.4px;
}

.filter-button:hover{
  background:#122435;
}

.chevron{
  color:#8198aa;
  font-size:11px;
}

.dropdown{
  position:absolute;
  top:calc(100% + 7px);
  left:6px;
  min-width:100%;
  max-height:330px;
  overflow-y:auto;
  background:#0b1926;
  border:1px solid #2b4559;
  border-radius:12px;
  box-shadow:0 22px 55px rgba(0,0,0,.55);
  padding:6px;
  display:none;
  z-index:9999;
}

.filter.open .dropdown{
  display:block;
}

.dropdown button{
  width:100%;
  border:0;
  background:transparent;
  color:#dce8f1;
  text-align:left;
  padding:10px 11px;
  border-radius:8px;
  white-space:nowrap;
}

.dropdown button:hover,
.dropdown button.selected{
  background:#173047;
  color:#fff;
}

.apply-wrap{
  display:flex;
  align-items:center;
  padding:8px 13px;
}

.apply{
  height:42px;
  padding:0 20px;
  border:0;
  border-radius:22px;
  background:var(--yellow);
  color:#111;
  font-weight:950;
  transition:.2s;
}

.apply:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

/* ================= CONTENT ================= */

.content-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:0 0 15px;
}

.content-head h2{
  margin:0;
  font-size:26px;
}

.content-head span{
  color:var(--muted);
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:18px;
}

.card{
  min-width:0;
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
  background:#0b1925;
  transition:.22s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#476276;
  box-shadow:0 14px 35px rgba(0,0,0,.35);
}

.card-image{
  aspect-ratio:2/3;
  position:relative;
  background:#132331;
  overflow:hidden;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.type-badge{
  position:absolute;
  left:9px;
  top:9px;
  padding:5px 8px;
  border-radius:6px;
  background:rgba(4,12,19,.88);
  border:1px solid #365066;
  font-size:10px;
  font-weight:900;
}

.card-body{
  padding:11px;
}

.card-title{
  font-size:15px;
  line-height:1.25;
  font-weight:850;
  min-height:38px;
}

.card-meta{
  display:flex;
  justify-content:space-between;
  gap:6px;
  margin-top:8px;
  font-size:12px;
  color:var(--muted);
}

.card-rating{
  color:var(--yellow);
  font-weight:900;
}

/* ================= PAGINATION ================= */

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:30px;
}

.page-btn{
  min-width:39px;
  height:39px;
  padding:0 11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0b1926;
  color:#dbe8f0;
  font-weight:800;
}

.page-btn:hover,
.page-btn.active{
  background:#173047;
  border-color:#4c687d;
}

.page-btn.next{
  padding:0 15px;
}

/* ================= EMPTY / LOADING ================= */

.loading{
  grid-column:1/-1;
  min-height:180px;
  display:grid;
  place-items:center;
  color:var(--muted);
}

.spinner{
  width:32px;
  height:32px;
  border:3px solid #294052;
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.empty{
  grid-column:1/-1;
  padding:60px 20px;
  text-align:center;
  color:var(--muted);
}

/* ================= DETAIL ================= */

.detail-view{
  min-height:calc(100vh - 76px);
}

.detail-hero{
  position:relative;
  min-height:610px;
  overflow:hidden;
  border-bottom:1px solid var(--line);
}

.detail-backdrop{
  position:absolute;
  inset:0;
}

.detail-backdrop img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detail-backdrop::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,#06111b 0%,rgba(6,17,27,.94) 24%,rgba(6,17,27,.57) 55%,rgba(6,17,27,.8) 100%),
    linear-gradient(0deg,#06111b 0%,transparent 45%);
}

.detail-inner{
  position:relative;
  z-index:2;
  width:min(1280px,calc(100% - 40px));
  margin:auto;
  padding:55px 0 65px;
  display:grid;
  grid-template-columns:260px 1fr;
  gap:35px;
}

.detail-poster{
  width:260px;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:15px;
  border:1px solid #456074;
  box-shadow:0 25px 55px rgba(0,0,0,.55);
}

.detail-content{
  max-width:760px;
  align-self:center;
}

.detail-type{
  color:var(--green);
  font-weight:950;
  letter-spacing:1.7px;
  text-transform:uppercase;
  font-size:13px;
}

.detail-title{
  font-size:clamp(38px,5vw,68px);
  line-height:1;
  letter-spacing:-2px;
  margin:10px 0 18px;
}

.detail-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}

.detail-overview{
  color:#b5c7d5;
  line-height:1.7;
  max-width:720px;
  font-size:15px;
}

.detail-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:23px;
}

.action-btn{
  border:1px solid #385268;
  background:#102333;
  color:#fff;
  border-radius:10px;
  padding:11px 15px;
  font-weight:850;
}

.action-btn:hover{
  background:#193247;
}

.action-btn.watch{
  background:var(--green);
  border-color:var(--green);
  color:#04130b;
}

.action-btn.schedule{
  background:#173b59;
}

.detail-section{
  width:min(1280px,calc(100% - 40px));
  margin:0 auto;
  padding:35px 0;
}

.detail-section h2{
  margin:0 0 18px;
  font-size:25px;
}

.cast-grid{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding-bottom:8px;
}

.cast{
  min-width:110px;
  width:110px;
}

.cast img{
  width:110px;
  height:145px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--line);
}

.cast-name{
  font-size:12px;
  font-weight:800;
  margin-top:7px;
}

.cast-character{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.providers{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.provider{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0c1b28;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.provider img{
  width:34px;
  height:34px;
  border-radius:7px;
}

.provider:hover{
  border-color:#49667c;
}

/* ================= EPISODES ================= */

.season-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:15px;
}

.season-btn{
  border:1px solid var(--line);
  background:#111c28;
  color:#b9c8d4;
  padding:10px 14px;
  border-radius:10px;
  white-space:nowrap;
  font-size:12px;
  font-weight:800;
}

.season-btn.active{
  background:#edf2f6;
  color:#101820;
  border-color:#edf2f6;
}

.episodes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.episode{
  display:grid;
  grid-template-columns:230px 1fr;
  min-height:145px;
  border:1px solid #1d2d3a;
  background:#11171d;
  border-radius:14px;
  overflow:hidden;
}

.episode img{
  width:230px;
  height:145px;
  object-fit:cover;
}

.episode-info{
  padding:14px;
  min-width:0;
}

.episode-title{
  font-weight:900;
  font-size:14px;
}

.episode-meta{
  color:#9caebe;
  font-size:11px;
  margin:7px 0;
}

.episode-rating{
  color:var(--yellow);
  font-weight:900;
}

.episode-overview{
  color:#aebdca;
  font-size:11px;
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.episode-actions{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.episode-btn{
  border:1px solid #293b4a;
  background:#17222c;
  color:#dce6ed;
  border-radius:7px;
  padding:6px 8px;
  font-size:10px;
  font-weight:800;
}

/* ================= TIMELINE ================= */

.timeline-page{
  width:min(1100px,calc(100% - 32px));
  margin:auto;
  padding:35px 0 80px;
}

.timeline{
  position:relative;
  padding:10px 0;
}

.timeline::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:2px;
  background:#294255;
  transform:translateX(-50%);
}

.timeline-item{
  position:relative;
  width:50%;
  padding:15px 45px 15px 0;
}

.timeline-item:nth-child(even){
  margin-left:50%;
  padding:15px 0 15px 45px;
}

.timeline-dot{
  position:absolute;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#142d3e;
  border:3px solid var(--green);
  right:-8px;
  top:28px;
  z-index:2;
}

.timeline-item:nth-child(even) .timeline-dot{
  left:-8px;
  right:auto;
}

.timeline-card{
  display:flex;
  gap:13px;
  border:1px solid var(--line);
  background:#0d1b27;
  border-radius:12px;
  padding:11px;
  cursor:pointer;
}

.timeline-card img{
  width:70px;
  height:96px;
  object-fit:cover;
  border-radius:7px;
}

.timeline-info{
  min-width:0;
}

.timeline-date{
  color:var(--green);
  font-size:11px;
  font-weight:900;
}

.timeline-title{
  margin-top:5px;
  font-weight:900;
  font-size:14px;
}

.timeline-kind{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

/* ================= MODALS ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:3000;
  display:none;
  background:rgba(2,8,13,.92);
  backdrop-filter:blur(16px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(620px,calc(100% - 30px));
  margin:auto;
  border:1px solid #2c4659;
  border-radius:18px;
  background:#0b1926;
  box-shadow:0 30px 90px rgba(0,0,0,.65);
  padding:25px;
}

.modal-title{
  margin:0 0 6px;
  font-size:25px;
}

.modal-sub{
  margin:0 0 20px;
  color:var(--muted);
}

.date-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.date-input{
  width:100%;
  height:48px;
  padding:0 12px;
  color:#fff;
  background:#07131e;
  border:1px solid #2b4457;
  border-radius:9px;
  outline:none;
  color-scheme:dark;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:22px;
}

.modal-btn{
  border:1px solid #2b4558;
  background:#142738;
  color:#fff;
  border-radius:9px;
  padding:10px 16px;
  font-weight:800;
}

.modal-btn.confirm{
  background:var(--green);
  border-color:var(--green);
  color:#04140c;
}

/* ================= RANDOM ================= */

.random-modal{
  background:#06111b;
}

.random-shell{
  width:100%;
  min-height:100%;
  padding:25px;
  overflow-y:auto;
}

.random-top{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.random-top h2{
  margin:0;
  font-size:30px;
}

.random-close{
  border:1px solid #334c5e;
  background:#0e202e;
  color:#fff;
  border-radius:10px;
  padding:9px 14px;
}

.random-panel{
  width:min(900px,100%);
  margin:35px auto;
  border:1px solid var(--line);
  background:#0b1926;
  border-radius:20px;
  padding:22px;
}

.random-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.random-label{
  color:#90a7b9;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:7px;
}

.random-select{
  width:100%;
  height:48px;
  color:#fff;
  background:#07131e;
  border:1px solid #2b4558;
  border-radius:9px;
  padding:0 12px;
  outline:none;
}

.random-result{
  display:none;
  width:min(650px,100%);
  margin:25px auto 0;
  border:1px solid #30495c;
  background:#0d1d2a;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
}

.random-result.show{
  display:grid;
  grid-template-columns:190px 1fr;
}

.random-result img{
  width:190px;
  height:285px;
  object-fit:cover;
}

.random-info{
  padding:22px;
}

.random-info h3{
  margin:0 0 12px;
  font-size:27px;
}

.pick-btn{
  margin-top:18px;
  border:0;
  background:var(--green);
  color:#04140c;
  border-radius:10px;
  padding:12px 20px;
  font-weight:950;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translate(-50%,20px);
  opacity:0;
  z-index:5000;
  background:#152838;
  border:1px solid #395369;
  color:#fff;
  padding:12px 17px;
  border-radius:10px;
  box-shadow:var(--shadow);
  transition:.25s;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= TOP BUTTON ================= */

.top-button{
  position:fixed;
  right:20px;
  bottom:20px;
  width:45px;
  height:45px;
  border-radius:50%;
  border:1px solid #365064;
  background:#102435;
  color:#fff;
  z-index:900;

<script>
/* ============================================================
   WATCHVAULT
   TMDB API SINGLE FILE APPLICATION
   ============================================================ */

const API_KEY = "9c95420163879f1c4726c540b305cbc6";
const API_BASE = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/";
const POSTER = IMG + "w500";
const BACKDROP = IMG + "original";
const PROFILE = IMG + "w185";

const state = {
  type:"movie",
  page:1,
  totalLoaded:0,
  filters:{
    year:"",
    rating:"",
    popular:"popular",
    genre:"",
    country:""
  },
  results:[],
  trending:[],
  trendIndex:0,
  detail:null,
  detailSeason:1,
  detailType:null,
  searchMode:false
};

const genres = [
  {id:"28",name:"Action"},
  {id:"12",name:"Adventure"},
  {id:"16",name:"Animation"},
  {id:"35",name:"Comedy"},
  {id:"80",name:"Crime"},
  {id:"99",name:"Documentary"},
  {id:"18",name:"Drama"},
  {id:"10751",name:"Family"},
  {id:"14",name:"Fantasy"},
  {id:"36",name:"History"},
  {id:"27",name:"Horror"},
  {id:"10402",name:"Music"},
  {id:"9648",name:"Mystery"},
  {id:"10749",name:"Romance"},
  {id:"878",name:"Science Fiction"},
  {id:"53",name:"Thriller"},
  {id:"10752",name:"War"},
  {id:"37",name:"Western"},
  {id:"BOLLYWOOD",name:"Bollywood"}
].sort((a,b)=>a.name.localeCompare(b.name));

const countries = [
  ["","All Countries"],
  ["US","United States"],
  ["GB","United Kingdom"],
  ["IN","India"],
  ["CA","Canada"],
  ["AU","Australia"],
  ["FR","France"],
  ["DE","Germany"],
  ["IT","Italy"],
  ["ES","Spain"],
  ["JP","Japan"],
  ["KR","South Korea"],
  ["CN","China"],
  ["HK","Hong Kong"],
  ["TW","Taiwan"],
  ["TH","Thailand"],
  ["PH","Philippines"],
  ["ID","Indonesia"],
  ["TR","Turkey"],
  ["MX","Mexico"],
  ["BR","Brazil"],
  ["AR","Argentina"],
  ["RU","Russia"],
  ["SE","Sweden"],
  ["DK","Denmark"],
  ["NO","Norway"],
  ["NL","Netherlands"],
  ["BE","Belgium"],
  ["IE","Ireland"],
  ["NZ","New Zealand"],
  ["ZA","South Africa"],
  ["AE","United Arab Emirates"],
  ["PK","Pakistan"]
].sort((a,b)=>{
  if(!a[0]) return -1;
  return a[1].localeCompare(b[1]);
});

const years = ["","1970","1971","1972","1973","1974","1975","1976","1977","1978","1979"];
for(let y=1980;y<=new Date().getFullYear();y++) years.push(String(y));
years.reverse();

/* ================= BASIC HELPERS ================= */

function escapeHTML(value=""){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function imgUrl(path,size="w500"){
  return path ? `${IMG}${size}${path}` : "";
}

function dateText(date){
  if(!date) return "Release date: N/A";
  const d = new Date(date+"T00:00:00");
  if(Number.isNaN(d.getTime())) return "Release date: N/A";
  return "Release date: " + d.toLocaleDateString("en-US",{
    month:"long",
    day:"numeric",
    year:"numeric"
  });
}

function shortDate(date){
  if(!date) return "N/A";
  const d = new Date(date+"T00:00:00");
  if(Number.isNaN(d.getTime())) return "N/A";
  return d.toLocaleDateString("en-US",{
    month:"short",
    day:"numeric",
    year:"numeric"
  });
}

function titleOf(item){
  return item.title || item.name || "Untitled";
}

function releaseOf(item){
  return item.release_date || item.first_air_date || "";
}

function typeOf(item){
  return item.media_type === "tv" || item.first_air_date !== undefined ? "tv" : "movie";
}

function uniqueItems(items){
  const map = new Map();
  items.forEach(x=>{
    const type = typeOf(x);
    const key = `${type}-${x.id}`;
    if(!map.has(key)) map.set(key,x);
  });
  return [...map.values()];
}

function showToast(message){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>{
    toast.classList.remove("show");
  },2500);
}

async function api(path,params={}){
  const url = new URL(API_BASE + path);
  url.searchParams.set("api_key",API_KEY);
  url.searchParams.set("language","en-US");

  Object.entries(params).forEach(([k,v])=>{
    if(v!==undefined && v!==null && v!==""){
      url.searchParams.set(k,v);
    }
  });

  const res = await fetch(url);

  if(!res.ok){
    throw new Error("TMDB request failed");
  }

  return res.json();
}

/* ================= LOCAL STORAGE ================= */

function getWatched(){
  try{
    return JSON.parse(localStorage.getItem("watchvault_watched") || "[]");
  }catch{
    return [];
  }
}

function getScheduled(){
  try{
    return JSON.parse(localStorage.getItem("watchvault_scheduled") || "[]");
  }catch{
    return [];
  }
}

function saveWatched(item){
  const arr = getWatched();

  const key = item.entryId || `${item.type}-${item.id}`;

  const filtered = arr.filter(x=>x.entryId!==key);

  filtered.push({
    entryId:key,
    id:item.id,
    type:item.type,
    title:item.title,
    poster:item.poster || "",
    date:item.date,
    episode:item.episode || null,
    season:item.season || null
  });

  localStorage.setItem("watchvault_watched",JSON.stringify(filtered));
}

function saveScheduled(item){
  const arr = getScheduled();

  const key = item.entryId || `${item.type}-${item.id}-${item.season||""}-${item.episode||""}`;

  const filtered = arr.filter(x=>x.entryId!==key);

  filtered.push({
    entryId:key,
    id:item.id,
    type:item.type,
    title:item.title,
    poster:item.poster || "",
    date:item.date,
    episode:item.episode || null,
    season:item.season || null
  });

  localStorage.setItem("watchvault_scheduled",JSON.stringify(filtered));
}

/* ================= BROWSE DROPDOWNS ================= */

const filterData = {
  type:[
    ["movie","Movies"],
    ["tv","TV Shows"]
  ],
  year:[
    ["","All Years"],
    ...years.filter(Boolean).map(y=>[y,y])
  ],
  rating:[
    ["","Any Rating"],
    ...Array.from({length:10},(_,i)=>{
      const n=i+1;
      return [String(n),`${n}/10+`];
    })
  ],
  popular:[
    ["popular","Popular"],
    ["alltime","All Time Popular"],
    ["today","Today Popular"],
    ["month","This Month Popular"],
    ["rated","High Rated"]
  ],
  genre:[
    ["","All Genres"],
    ...genres.map(g=>[g.id,g.name])
  ],
  country:countries
};

function buildFilters(){

  document.querySelectorAll(".filter").forEach(filter=>{

    const name = filter.dataset.filter;
    const dropdown = filter.querySelector(".dropdown");

    dropdown.innerHTML = "";

    filterData[name].forEach(([value,label])=>{
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.value = value;
      btn.textContent = label;

      btn.addEventListener("click",(e)=>{
        e.stopPropagation();

        state.filters[name] = value;

        const valueEl = filter.querySelector(".filter-value");
        valueEl.textContent = label.toUpperCase();

        dropdown.querySelectorAll("button").forEach(b=>{
          b.classList.remove("selected");
        });

        btn.classList.add("selected");
        filter.classList.remove("open");
      });

      dropdown.appendChild(btn);
    });

    filter.querySelector(".filter-button").addEventListener("click",(e)=>{
      e.stopPropagation();

      document.querySelectorAll(".filter.open").forEach(f=>{
        if(f!==filter) f.classList.remove("open");
      });

      filter.classList.toggle("open");
    });
  });

  document.addEventListener("click",()=>{
    document.querySelectorAll(".filter.open").forEach(f=>{
      f.classList.remove("open");
    });
  });
}

/* ================= FETCH DISCOVERY ================= */

async function discoverPage(page){

  const type = state.type;
  const params = {
    include_adult:false,
    include_video:false,
    sort_by:"popularity.desc",
    page
  };

  if(state.filters.year){
    if(type==="movie") params.primary_release_year = state.filters.year;
    else params.first_air_date_year = state.filters.year;
  }

  if(state.filters.rating){
    params["vote_average.gte"] = state.filters.rating;
  }

  if(state.filters.genre && state.filters.genre!=="BOLLYWOOD"){
    params.with_genres = state.filters.genre;
  }

  if(state.filters.country){
    params.with_origin_country = state.filters.country;
  }

  if(state.filters.genre==="BOLLYWOOD"){
    params.with_origin_country = "IN";
    params.with_original_language = "hi";
  }

  if(state.filters.popular==="alltime"){
    params.sort_by = "vote_count.desc";
  }

  if(state.filters.popular==="rated"){
    params.sort_by = "vote_average.desc";
    params["vote_count.gte"] = 200;
  }

  if(state.filters.popular==="today"){
    params.sort_by = "popularity.desc";
  }

  if(state.filters.popular==="month"){
    params.sort_by = "popularity.desc";
  }

  return api(`/discover/${type}`,params);
}

async function loadResults(page=1){

  state.page = page;

  const grid = document.getElementById("resultsGrid");
  grid.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
    </div>
  `;

  document.getElementById("pagination").innerHTML = "";

  try{

    let all = [];

    /*
      TMDB returns 20 items/page.
      We fetch 3 TMDB pages to make one application page
      contain up to 50 unique titles.
    */
    for(let p=1;p<=3;p++){
      const tmdbPage = ((page-1)*3)+p;

      if(tmdbPage>500) break;

      const data = await discoverPage(tmdbPage);

      all.push(...(data.results || []));

      if((data.results || []).length<20) break;
    }

    all = uniqueItems(all).slice(0,50);

    state.results = all;

    renderResults(all);
    renderPagination(page);

    document.getElementById("resultsTitle").textContent =
      state.type==="movie" ? "Movies" : "TV Shows";

    document.getElementById("resultsCount").textContent =
      all.length ? `${all.length} titles` : "";

  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="empty">
        Unable to load titles. Please try again.
      </div>
    `;
  }
}

/* ================= RENDER RESULTS ================= */

function renderResults(items){

  const grid = document.getElementById("resultsGrid");

  if(!items.length){
    grid.innerHTML = `
      <div class="empty">
        No movies or TV shows found for these filters.
      </div>
    `;
    return;
  }

  grid.innerHTML = items.map(item=>{

    const type = typeOf(item);
    const title = titleOf(item);
    const date = releaseOf(item);

    return `
      <article class="card" data-id="${item.id}" data-type="${type}">
        <div class="card-image">
          ${
            item.poster_path
            ? `<img src="${imgUrl(item.poster_path,"w500")}" alt="${escapeHTML(title)}" loading="lazy">`
            : `<div class="empty">No image</div>`
          }

          <span class="type-badge">
            ${type==="movie" ? "MOVIE" : "TV SHOW"}
          </span>
        </div>

        <div class="card-body">
          <div class="card-title">${escapeHTML(title)}</div>

          <div class="card-meta">
            <span>${date ? date.slice(0,4) : "N/A"}</span>
            <span class="card-rating">★ ${item.vote_average ? item.vote_average.toFixed(1) : "—"}</span>
          </div>
        </div>
      </article>
    `;
  }).join("");

  grid.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click",()=>{
      openDetail(
        Number(card.dataset.id),
        card.dataset.type
      );
    });
  });
}

/* ================= PAGINATION ================= */

function renderPagination(current){

  const box = document.getElementById("pagination");

  /*
    Deliberately NO total page count.
    Only Back + nearby page numbers + Next.
  */

  const buttons = [];

  if(current>1){
    buttons.push(`
      <button class="page-btn next" data-page="${current-1}">
        ← Back
      </button>
    `);
  }

  const nums = new Set();

  if(current===1){
    nums.add(1);
    nums.add(2);
    nums.add(3);
  }else{
    nums.add(current-1);
    nums.add(current);
    nums.add(current+1);
  }

  [...nums].sort((a,b)=>a-b).forEach(n=>{
    buttons.push(`
      <button class="page-btn ${n===current?"active":""}" data-page="${n}">
        ${n}
      </button>
    `);
  });

  buttons.push(`
    <button class="page-btn next" data-page="${current+1}">
      Next →
    </button>
  `);

  box.innerHTML = buttons.join("");

  box.querySelectorAll(".page-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const page = Number(btn.dataset.page);

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

      loadResults(page);
    });
  });
}

async function loadTrending(){

  try{

    const data = await api("/trending/all/week",{
      include_adult:false
    });

    state.trending = uniqueItems(
      (data.results || []).filter(x=>x.media_type==="movie" || x.media_type==="tv")
    ).slice(0,20);

    state.trendIndex = 0;

    renderTrending();

  }catch(e){
    console.error(e);
  }
}

function renderTrending(){

  if(!state.trending.length) return;

  const item = state.trending[state.trendIndex];

  const type = typeOf(item);
  const title = titleOf(item);
  const date = releaseOf(item);

  const backdrop = document.getElementById("trendBackdrop");

  backdrop.src =
    item.backdrop_path
      ? imgUrl(item.backdrop_path,"original")
      : item.poster_path
        ? imgUrl(item.poster_path,"w1280")
        : "";

  backdrop.alt = title;

  document.getElementById("trendTitle").textContent = title;

  document.getElementById("trendType").textContent =
    type==="movie" ? "MOVIE" : "TV SHOW";

  document.getElementById("trendDate").textContent =
    dateText(date);

  document.getElementById("trendRating").textContent =
    `★ ${item.vote_average ? item.vote_average.toFixed(1) : "—"}`;
}

function nextTrending(direction=1){

  if(!state.trending.length) return;

  state.trendIndex += direction;

  if(state.trendIndex>=state.trending.length){
    state.trendIndex=0;
  }

  if(state.trendIndex<0){
    state.trendIndex=state.trending.length-1;
  }

  renderTrending();
}

document.getElementById("trendNext").addEventListener("click",(e)=>{
  e.stopPropagation();
  nextTrending(1);
});

document.getElementById("trendPrev").addEventListener("click",(e)=>{
  e.stopPropagation();
  nextTrending(-1);
});

document.getElementById("trendInfo").addEventListener("click",()=>{
  const item = state.trending[state.trendIndex];

  if(item){
    openDetail(item.id,typeOf(item));
  }
});

/* ================= PROVIDERS ================= */

function getProviders(item){

  const country =
    item["watch/providers"]?.results?.IN ||
    item["watch/providers"]?.results?.US ||
    Object.values(item["watch/providers"]?.results || {})[0];

  if(!country) return [];

  const all = [
    ...(country.flatrate || []),
    ...(country.rent || []),
    ...(country.buy || [])
  ];

  const map = new Map();

  all.forEach(p=>{
    if(!map.has(p.provider_id)){
      map.set(p.provider_id,{
        provider_name:p.provider_name,
        logo_path:p.logo_path,
        url:country.link || `https://www.themoviedb.org/${typeOf(item)}/${item.id}/watch`
      });
    }
  });

  return [...map.values()];
}

function openEpisodeDateModal(
  mode,
  id,
  season,
  episode,
  episodeName,
  stillPath
){

  dateContext = {
    mode,
    id,
    type:"tv",
    title:titleOf(state.detail),
    poster:stillPath || state.detail.poster_path || "",
    season,
    episode,
    episodeName,
    entryId:`tv-${id}-${season}-${episode}`
  };

  document.getElementById("dateModalTitle").textContent =
    mode==="watched"
      ? "Mark Episode as Watched"
      : "Schedule Episode";

  document.getElementById("dateModalSub").textContent =
    `${titleOf(state.detail)} — S${season} E${episode} ${episodeName}`;

  document.getElementById("datePicker").value =
    new Date().toISOString().slice(0,10);

  document.getElementById("dateModal").classList.add("show");
}

document.getElementById("dateCancel").addEventListener("click",()=>{
  dateContext=null;
  document.getElementById("dateModal").classList.remove("show");
});

document.getElementById("dateConfirm").addEventListener("click",()=>{

  if(!dateContext) return;

  const date = document.getElementById("datePicker").value;

  if(!date){
    showToast("Please select a date.");
    return;
  }

  const entry = {
    ...dateContext,
    date
  };

  if(dateContext.mode==="watched"){
    saveWatched(entry);
    showToast("Saved to Watched Timeline.");
  }else{
    saveScheduled(entry);
    showToast("Saved to Scheduled Timeline.");
  }

  dateContext=null;
  document.getElementById("dateModal").classList.remove("show");
});

function handleRoute(push=false){

  const hash=location.hash;

  if(hash==="#timeline"){
    openTimeline();
    return;
  }

  const match=hash.match(/^#(movie|tv)\/(\d+)$/);

  if(match){
    openDetail(
      Number(match[2]),
      match[1],
      false
    );
    return;
  }

  goHome(false);

    }

    if(document.getElementById("dateModal").classList.contains("show")){
      document.getElementById("dateModal").classList.remove("show");
    }
  }
});

/* ================= INIT ================= */

function init(){

  buildFilters();
  buildRandomGenres();
  loadTrending();

  const match=location.hash.match(/^#(movie|tv)\/(\d+)$/);

  if(match){
    openDetail(
      Number(match[2]),
      match[1],
      false
    );
  }else if(location.hash==="#timeline"){
    openTimeline();
  }else{
    loadResults(1);
  }
}

init();

</script>
