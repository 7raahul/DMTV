<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie & TV Show Portal</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #16191e;
      --accent-color: #e50914;
      --text-color: #ffffff;
      --text-muted: #a0a0a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
    }

    /* Header & Nav */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(13, 15, 18, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); cursor: pointer; }
    .nav-links { display: flex; gap: 1rem; list-style: none; }
    .nav-links li { cursor: pointer; padding: 0.5rem 1rem; border-radius: 4px; }
    .nav-links li.active, .nav-links li:hover { background: var(--accent-color); }
    
    .search-box input {
      padding: 0.5rem 1rem;
      border-radius: 20px;
      border: none;
      outline: none;
      background: #222;
      color: #fff;
    }

    /* Hero Section */
    .hero {
      position: relative;
      height: 60vh;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    .hero-slide {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      display: flex;
      align-items: flex-end;
    }
    .hero-slide.active { opacity: 1; }
    .hero-overlay {
      background: linear-gradient(to top, var(--bg-color), transparent);
      width: 100%;
      padding: 3rem 2rem 2rem;
    }
    .hero-title { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .hero-overview { max-width: 600px; color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem; }
    .hero-dots {
      position: absolute;
      bottom: 10px;
      right: 20px;
      display: flex;
      gap: 5px;
      z-index: 10;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #555;
      cursor: pointer;
    }
    .dot.active { background: var(--accent-color); }

    /* Main Content */
    main { padding: 2rem; }
    .section-title { margin-bottom: 1rem; font-size: 1.5rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 260px; object-fit: cover; background: #222; }
    .card-info { padding: 0.8rem; }
    .card-title { font-size: 0.95rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem; }

    /* Detail Overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      overflow-y: auto;
      display: flex;
      justify-content: center;
    }
    .overlay.hidden { display: none; }
    .detail-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 900px;
      margin: 2rem auto;
      border-radius: 8px;
      position: relative;
      padding: 2rem;
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 1.8rem;
      cursor: pointer;
      color: #fff;
    }
    .detail-header { display: flex; gap: 2rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .detail-poster { width: 220px; border-radius: 8px; }
    .detail-info { flex: 1; }
    .season-btn {
      padding: 0.4rem 0.8rem;
      margin: 0.2rem;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .season-btn.active { background: var(--accent-color); }
    .episodes { display: grid; gap: 1rem; margin-top: 1rem; }
    .episode { display: flex; gap: 1rem; background: #222; padding: 0.8rem; border-radius: 6px; }
    .episode-image { width: 120px; height: 70px; object-fit: cover; border-radius: 4px; }
    
    /* Utilities */
    .loading { text-align: center; padding: 2rem; color: var(--text-muted); }
    .empty { text-align: center; padding: 2rem; color: var(--text-muted); }
    #toTop {
      position: fixed;
      bottom: 20px; right: 20px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0.8rem;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="goHome()">TMDB Portal</div>
    <ul class="nav-links">
      <li id="filter-all" class="active" onclick="setMainMediaType('all')">All</li>
      <li id="filter-movie" onclick="setMainMediaType('movie')">Movies</li>
      <li id="filter-tv" onclick="setMainMediaType('tv')">TV Shows</li>
    </ul>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search movies or TV...">
    </div>
  </header>

  <div class="hero">
    <div id="heroSlider"></div>
    <div id="heroDots" class="hero-dots"></div>
  </div>

  <main>
    <h2 class="section-title">Explore Content</h2>
    <div id="browseGrid" class="grid"></div>
  </main>

  <!-- Detail Modal/Overlay -->
  <div id="detailOverlay" class="overlay hidden">
    <div class="detail-container">
      <span id="detailBack" class="close-btn">&times;</span>
      <div id="detailContent"></div>
    </div>
  </div>

  <button id="toTop">↑</button>

  <script>
    /* API Configurations */
    const API_KEY = "15d159263938087973770b32b07d9de1"; // standard TMDB v3 API key placeholder
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMAGE_BASE = "https://image.tmdb.org/t/p";
    const POSTER_SIZE = "w500";
    const BACKDROP_SIZE = "original";
    const STILL_SIZE = "w300";

    const state = {
      filters: { type: "all" },
      page: 1,
      search: ""
    };

    let heroTimer = null;

    // Helper: Escaping HTML
    function esc(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Helper: Date Formatting
    function formatDate(dateStr) {
      if (!dateStr) return "N/A";
      const options = { year: 'numeric', month: 'short', day: 'numeric' };
      return new Date(dateStr).toLocaleDateString(undefined, options);
    }

    // Helper: Image Generator with Fallback
    function image(path, size = "w500") {
      return path ? `${IMAGE_BASE}/${size}${path}` : "https://via.placeholder.com/500x750?text=No+Image";
    }

    // Main API Fetcher
    async function api(endpoint, params = {}) {
      const url = new URL(`${BASE_URL}${endpoint}`);
      url.searchParams.append("api_key", API_KEY);
      Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        return await response.json();
      } catch (error) {
        console.error("API Call Failed:", error);
        throw error;
      }
    }

    /* Load Hero / Trending Slider */
    async function loadTrending() {
      const heroSlider = document.getElementById("heroSlider");
      const heroDots = document.getElementById("heroDots");
      if (!heroSlider) return;

      try {
        const endpoint = state.filters.type === "all" ? "/trending/all/day" : `/trending/${state.filters.type}/day`;
        const data = await api(endpoint);
        const items = data.results.slice(0, 5);

        if (!items || items.length === 0) return;

        heroSlider.innerHTML = items.map((item, idx) => `
          <div class="hero-slide ${idx === 0 ? 'active' : ''}" style="background-image: url('${image(item.backdrop_path, BACKDROP_SIZE)}')">
            <div class="hero-overlay">
              <h1 class="hero-title">${esc(item.title || item.name)}</h1>
              <p class="hero-overview">${esc(item.overview ? item.overview.slice(0, 150) + "..." : "No overview available.")}</p>
            </div>
          </div>
        `).join("");

        if (heroDots) {
          heroDots.innerHTML = items.map((_, idx) => `
            <div class="dot ${idx === 0 ? 'active' : ''}" onclick="setHeroSlide(${idx})"></div>
          `).join("");
        }

        startHeroAutoSlide(items.length);
      } catch (err) {
        console.error("Error loading trending:", err);
      }
    }

    function setHeroSlide(index) {
      const slides = document.querySelectorAll(".hero-slide");
      const dots = document.querySelectorAll(".dot");
      slides.forEach((s, i) => s.classList.toggle("active", i === index));
      dots.forEach((d, i) => d.classList.toggle("active", i === index));
    }

    function startHeroAutoSlide(total) {
      if (heroTimer) clearInterval(heroTimer);
      let current = 0;
      heroTimer = setInterval(() => {
        current = (current + 1) % total;
        setHeroSlide(current);
      }, 5000);
    }

    /* Load Main Browse Grid */
    async function loadBrowse() {
      const grid = document.getElementById("browseGrid");
      if (!grid) return;

      grid.innerHTML = `<div class="loading">Loading content...</div>`;

      try {
        let endpoint = "";
        let params = { page: state.page };

        if (state.search) {
          endpoint = state.filters.type === "all" ? "/search/multi" : `/search/${state.filters.type}`;
          params.query = state.search;
        } else {
          endpoint = state.filters.type === "all" ? "/trending/all/week" : `/discover/${state.filters.type}`;
        }

        const data = await api(endpoint, params);
        if (!data.results || data.results.length === 0) {
          grid.innerHTML = `<div class="empty">No content found.</div>`;
          return;
        }

        grid.innerHTML = data.results.map(item => {
          const mediaType = item.media_type || (state.filters.type !== "all" ? state.filters.type : "movie");
          const title = item.title || item.name;
          const releaseDate = item.release_date || item.first_air_date;

          return `
            <div class="card" onclick="loadDetail('${mediaType}', ${item.id})">
              <img src="${image(item.poster_path, POSTER_SIZE)}" alt="${esc(title)}" loading="lazy">
              <div class="card-info">
                <div class="card-title">${esc(title)}</div>
                <div class="card-meta">
                  <span>${formatDate(releaseDate).split(',')[1] || ''}</span>
                  <span>★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</span>
                </div>
              </div>
            </div>
          `;
        }).join("");

      } catch (err) {
        grid.innerHTML = `<div class="empty">Error fetching data. Check your connection.</div>`;
      }
    }

    /* Detail View Renderer */
    async function loadDetail(mediaType, id) {
      const overlay = document.getElementById("detailOverlay");
      const content = document.getElementById("detailContent");
      if (!overlay || !content) return;

      overlay.classList.remove("hidden");
      document.body.style.overflow = "hidden";
      content.innerHTML = `<div class="loading">Loading details...</div>`;

      try {
        const details = await api(`/${mediaType}/${id}`, { append_to_response: "credits,similar" });
        const title = details.title || details.name;

        let seasonsHTML = "";
        if (mediaType === "tv" && details.seasons?.length) {
          seasonsHTML = `
            <div class="detail-section">
              <h3>Seasons</h3>
              <div class="seasons-list">
                ${details.seasons.map((s, idx) => `
                  <button class="season-btn ${idx === 0 ? 'active' : ''}" onclick="loadSeason(${details.id}, ${s.season_number}, this)">
                    Season ${s.season_number}
                  </button>
                `).join('')}
              </div>
              <div id="episodesBox"></div>
            </div>
          `;
        }

        content.innerHTML = `
          <div class="detail-header">
            <img class="detail-poster" src="${image(details.poster_path, POSTER_SIZE)}" alt="${esc(title)}">
            <div class="detail-info">
              <h1>${esc(title)}</h1>
              <p style="color: var(--text-muted); margin: 0.5rem 0;">
                ${formatDate(details.release_date || details.first_air_date)} | ★ ${details.vote_average?.toFixed(1) || "N/A"}
              </p>
              <p class="overview">${esc(details.overview || "No detailed overview available.")}</p>
            </div>
          </div>
          ${seasonsHTML}
        `;

        if (mediaType === "tv" && details.seasons?.length) {
          loadSeason(details.id, details.seasons[0].season_number);
        }

      } catch (err) {
        content.innerHTML = `<div class="empty">Failed to load content details.</div>`;
      }
    }

    /* Load TV Season Episodes */
    async function loadSeason(tvId, seasonNumber, btnElement) {
      if (btnElement) {
        document.querySelectorAll(".season-btn").forEach(b => b.classList.remove("active"));
        btnElement.classList.add("active");
      }

      const box = document.getElementById("episodesBox");
      if (!box) return;

      box.innerHTML = `<div class="loading">Loading episodes...</div>`;

      try {
        const seasonData = await api(`/tv/${tvId}/season/${seasonNumber}`);
        if (!seasonData.episodes || !seasonData.episodes.length) {
          box.innerHTML = `<div class="empty">No episodes available.</div>`;
          return;
        }

        box.innerHTML = `<div class="episodes">` +
          seasonData.episodes.map(ep => `
            <div class="episode">
              <img class="episode-image" src="${image(ep.still_path, STILL_SIZE)}" alt="${esc(ep.name)}" loading="lazy">
              <div class="episode-info">
                <div class="episode-name">E${ep.episode_number}. ${esc(ep.name)}</div>
                <div class="episode-meta">
                  <span>📅 ${esc(formatDate(ep.air_date))}</span>
                  ${ep.vote_average ? `<span>★ ${ep.vote_average.toFixed(1)}</span>` : ""}
                </div>
                <div class="episode-overview" style="font-size:0.85rem; color:#aaa; margin-top:4px;">
                  ${esc(ep.overview || "No overview available.")}
                </div>
              </div>
            </div>
          `).join("") + `</div>`;
      } catch (err) {
        box.innerHTML = `<div class="empty">Unable to load episodes.</div>`;
      }
    }

    /* Navigation & Utility Event Handlers */
    function goHome() {
      document.getElementById("detailOverlay")?.classList.add("hidden");
      document.body.style.overflow = "";
      state.filters.type = "all";
      state.search = "";
      const searchInput = document.getElementById("searchInput");
      if (searchInput) searchInput.value = "";
      
      updateFilterUI();
      loadTrending();
      loadBrowse();
    }

    function setMainMediaType(type) {
      state.filters.type = type;
      state.page = 1;
      updateFilterUI();
      loadTrending();
      loadBrowse();
    }

    function updateFilterUI() {
      document.querySelectorAll(".nav-links li").forEach(li => li.classList.remove("active"));
      document.getElementById(`filter-${state.filters.type}`)?.classList.add("active");
    }

    // Initialization on Page Load
    document.addEventListener("DOMContentLoaded", () => {
      loadTrending();
      loadBrowse();

      // Debounce Search Event Listener
      let searchDebounceTimer;
      document.getElementById("searchInput")?.addEventListener("input", (e) => {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
          state.search = e.target.value.trim();
          state.page = 1;
          loadBrowse();
        }, 400);
      });

      // Scroll To Top Button
      document.getElementById("toTop")?.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      // Modal Close Event
      document.getElementById("detailBack")?.addEventListener("click", () => {
        document.getElementById("detailOverlay")?.classList.add("hidden");
        document.body.style.overflow = "";
      });
    });
  </script>
</body>
</html>
