<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie & TV Explorer</title>

<style>
:root{
  --bg:#07090d;
  --panel:#10141b;
  --panel2:#151a22;
  --line:#252b35;
  --text:#f5f7fa;
  --muted:#9299a6;
  --accent:#e7ff4f;
  --accentText:#101300;
  --danger:#ff5d73;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:50;
  height:64px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 28px;
  background:rgba(7,9,13,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(16px);
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:-.5px;
  white-space:nowrap;
}

.logo span{
  color:var(--accent);
}

.search{
  flex:1;
  max-width:600px;
  margin:auto;
  position:relative;
}

.search input{
  width:100%;
  height:42px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0d1117;
  color:white;
  padding:0 16px;
  outline:none;
}

.search input:focus{
  border-color:#596270;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  border:1px solid var(--line);
  background:#10141a;
  color:white;
  width:40px;
  height:40px;
  border-radius:10px;
}

/* ================= MAIN ================= */

main{
  max-width:1440px;
  margin:auto;
  padding:26px 28px 80px;
}

.section-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:12px;
  margin:28px 0 14px;
}

.section-title h2{
  margin:0;
  font-size:22px;
}

.section-title p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* ================= TRENDING ================= */

.trending-box{
  position:relative;
  min-height:310px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:18px;
  background:#0e1218;
  display:grid;
  grid-template-columns:1fr 1fr;
}

.trending-info{
  padding:30px 34px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
}

.trending-info .badge{
  display:inline-flex;
  width:max-content;
  padding:6px 10px;
  border-radius:7px;
  background:rgba(231,255,79,.1);
  color:var(--accent);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.trending-info h1{
  margin:12px 0 8px;
  font-size:clamp(24px,3vw,42px);
  line-height:1.05;
  letter-spacing:-1px;
}

.trending-meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  color:#c5cad2;
  font-size:13px;
}

.trending-overview{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  max-width:650px;
  margin:14px 0 0;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.trending-image{
  min-height:310px;
  overflow:hidden;
  background:#080a0d;
}

.trending-image img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
}

.trending-nav{
  position:absolute;
  right:18px;
  bottom:16px;
  display:flex;
  gap:7px;
  z-index:3;
}

.trending-nav button{
  width:38px;
  height:34px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(7,9,13,.8);
  color:white;
  font-size:18px;
  backdrop-filter:blur(8px);
}

.trending-nav button:hover{
  background:var(--accent);
  color:var(--accentText);
}

/* ================= BROWSE BY ================= */

.browse-box{
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--panel);
  padding:12px;
}

.browse-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.browse-label{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  margin-right:4px;
}

.filter-wrap{
  position:relative;
}

.filter-select{
  appearance:none;
  min-width:132px;
  height:38px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#151a21;
  color:#f4f5f7;
  padding:0 34px 0 12px;
  outline:none;
  font-size:13px;
  font-weight:700;
}

.filter-select:focus{
  border-color:#5b6472;
}

.filter-wrap:after{
  content:"⌄";
  position:absolute;
  right:12px;
  top:8px;
  color:#aeb4be;
  pointer-events:none;
}

.filter-panel{
  margin-top:10px;
  border-top:1px solid var(--line);
  padding-top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.filter-panel button{
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 12px;
  background:#151a21;
  color:#dce0e6;
}

.filter-panel button:hover,
.filter-panel button.active{
  background:var(--accent);
  color:var(--accentText);
  border-color:var(--accent);
}

/* ================= GRID ================= */

.results-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:28px 0 14px;
}

.results-head h2{
  margin:0;
  font-size:20px;
}

.results-count{
  color:var(--muted);
  font-size:12px;
}

.movie-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:16px;
}

.card{
  position:relative;
  min-width:0;
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
  background:var(--panel);
  transition:.18s ease;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#454d59;
}

.poster{
  aspect-ratio:2/3;
  background:#171b22;
  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.card-info{
  padding:11px;
}

.card-title{
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
}

.rating{
  color:var(--accent);
  font-weight:800;
}

/* ================= PAGINATION ================= */

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:28px 0;
}

.pagination button{
  min-width:42px;
  height:38px;
  border:1px solid var(--line);
  background:var(--panel);
  color:white;
  border-radius:9px;
}

.pagination button:hover:not(:disabled),
.pagination button.active{
  background:var(--accent);
  color:var(--accentText);
  border-color:var(--accent);
}

.pagination button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

/* ================= RANDOM PICKER ================= */

.random-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:#05070a;
  overflow:auto;
}

.random-modal{
  width:100%;
  min-height:100%;
  display:flex;
  flex-direction:column;
}

.random-header{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  border-bottom:1px solid var(--line);
  background:#080b0f;
}

.random-header h2{
  margin:0;
  font-size:21px;
}

.random-close{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#11151b;
  color:white;
  font-size:20px;
}

.random-body{
  width:min(900px,calc(100% - 32px));
  margin:auto;
  padding:35px 0 60px;
}

.random-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.random-field{
  background:#10141a;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
}

.random-field label{
  display:block;
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:.8px;
  margin-bottom:7px;
}

.random-field select{
  width:100%;
  height:42px;
  background:#171c23;
  color:white;
  border:1px solid var(--line);
  border-radius:8px;
  padding:0 10px;
  outline:none;
}

.random-action{
  margin-top:18px;
  width:100%;
  height:46px;
  border:0;
  border-radius:10px;
  background:var(--accent);
  color:var(--accentText);
  font-weight:900;
}

.random-result{
  margin-top:22px;
  display:none;
  grid-template-columns:220px 1fr;
  gap:22px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#10141a;
}

.random-result.show{
  display:grid;
}

.random-result-poster{
  aspect-ratio:2/3;
  overflow:hidden;
  border-radius:10px;
  background:#171b21;
}

.random-result-poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.random-result-content{
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.random-result-content h3{
  font-size:28px;
  margin:0 0 8px;
}

.random-result-content p{
  color:var(--muted);
  line-height:1.6;
}

.random-result-click{
  cursor:pointer;
}

/* ================= DETAILS ================= */

.details-overlay{
  position:fixed;
  inset:0;
  z-index:180;
  background:#06080c;
  overflow:auto;
}

.details-page{
  min-height:100%;
}

.details-backdrop{
  position:relative;
  min-height:470px;
  overflow:hidden;
  background:#080a0d;
}

.details-backdrop:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,#06080c 0%,rgba(6,8,12,.75) 42%,rgba(6,8,12,.08) 100%),
             linear-gradient(0deg,#06080c 0%,transparent 35%);
}

.details-backdrop img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

.details-content{
  position:relative;
  z-index:2;
  max-width:1400px;
  margin:-120px auto 0;
  padding:0 28px 70px;
}

.details-top{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:28px;
  align-items:end;
}

.details-poster{
  aspect-ratio:2/3;
  border-radius:13px;
  overflow:hidden;
  border:1px solid #343a44;
  background:#10141a;
}

.details-poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.details-info{
  padding-bottom:8px;
}

.close-details{
  position:absolute;
  right:28px;
  top:24px;
  z-index:5;
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;
  background:rgba(5,7,10,.72);
  color:white;
  font-size:20px;
}

.details-type{
  color:var(--accent);
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
}

.details-info h1{
  font-size:clamp(30px,5vw,58px);
  margin:8px 0;
  line-height:1;
  letter-spacing:-1.5px;
}

.details-meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  color:#d0d5dc;
  font-size:13px;
}

.details-rating{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:12px;
  font-weight:900;
  color:var(--accent);
}

.details-overview{
  max-width:850px;
  color:#aeb4bd;
  line-height:1.65;
  font-size:14px;
  margin:16px 0;
}

.details-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.details-actions button{
  height:40px;
  padding:0 14px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#11161c;
  color:white;
  font-weight:800;
}

.details-actions button.primary{
  background:var(--accent);
  color:var(--accentText);
  border-color:var(--accent);
}

/* seasons */

.seasons-section{
  margin-top:35px;
}

.season-select{
  width:220px;
  height:42px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#11161c;
  color:white;
  padding:0 12px;
}

.episodes{
  margin-top:14px;
  display:grid;
  gap:10px;
}

.episode{
  display:grid;
  grid-template-columns:150px 1fr auto;
  gap:15px;
  align-items:center;
  border:1px solid var(--line);
  border-radius:11px;
  background:#10141a;
  padding:9px;
}

.episode-thumb{
  aspect-ratio:16/9;
  border-radius:7px;
  overflow:hidden;
  background:#171b21;
}

.episode-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.episode h4{
  margin:0 0 5px;
  font-size:14px;
}

.episode p{
  margin:0;
  color:var(--muted);
  font-size:12px;
}

.episode-rating{
  color:var(--accent);
  font-weight:800;
  font-size:12px;
}

/* cast */

.cast-section{
  margin-top:38px;
}

.cast-grid{
  display:flex;
  gap:12px;
  overflow:auto;
  padding-bottom:8px;
}

.cast-card{
  flex:0 0 110px;
}

.cast-photo{
  width:110px;
  height:145px;
  border-radius:9px;
  overflow:hidden;
  background:#151a20;
}

.cast-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cast-name{
  margin-top:7px;
  font-size:12px;
  font-weight:800;
}

.cast-character{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

/* related */

.related-section{
  margin-top:38px;
}

.related-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px;
}

/* toast */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:400;
  padding:12px 15px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#11161d;
  color:white;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* top button */

.to-top{
  position:fixed;
  right:20px;
  bottom:20px;
  width:44px;
  height:44px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#12171e;
  color:white;
  z-index:80;
  font-size:18px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.to-top.show{
  opacity:1;
  pointer-events:auto;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){
  .movie-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .related-grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
}

@media(max-width:800px){
  .header{
    padding:0 14px;
    gap:9px;
  }

  .logo{
    font-size:17px;
  }

  .header-actions{
    display:none;
  }

  main{
    padding:18px 14px 70px;
  }

  .trending-box{
    min-height:240px;
    grid-template-columns:1fr 1fr;
    border-radius:13px;
  }

  .trending-info{
    padding:18px;
  }

  .trending-info h1{
    font-size:24px;
  }

  .trending-overview{
    -webkit-line-clamp:2;
    font-size:11px;
  }

  .trending-image{
    min-height:240px;
  }

  .movie-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }

  .card-info{
    padding:8px;
  }

  .card-title{
    font-size:12px;
  }

  .random-options{
    grid-template-columns:1fr;
  }

  .random-result{
    grid-template-columns:130px 1fr;
  }

  .random-result-content h3{
    font-size:21px;
  }

  .details-backdrop{
    min-height:300px;
  }

  .details-content{
    margin:-65px auto 0;
    padding:0 14px 50px;
  }

  .details-top{
    grid-template-columns:115px 1fr;
    gap:15px;
  }

  .details-info h1{
    font-size:27px;
  }

  .details-overview{
    font-size:13px;
  }

  .episode{
    grid-template-columns:110px 1fr;
  }

  .episode-rating{
    grid-column:2;
  }

  .related-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .close-details{
    right:14px;
    top:14px;
  }
}

@media(max-width:520px){
  .search{
    max-width:none;
  }

  .browse-row{
    align-items:stretch;
  }

  .browse-label{
    width:100%;
  }

  .filter-select{
    min-width:115px;
  }

  .trending-box{
    grid-template-columns:1fr;
  }

  .trending-image{
    order:-1;
    min-height:170px;
    height:170px;
  }

  .trending-info{
    min-height:190px;
  }

  .trending-nav{
    bottom:10px;
    right:10px;
  }

  .movie-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .details-top{
    grid-template-columns:95px 1fr;
  }

  .details-info h1{
    font-size:22px;
  }

  .details-meta{
    font-size:11px;
    gap:7px;
  }

  .details-actions button{
    height:36px;
    padding:0 10px;
    font-size:11px;
  }

  .episode{
    grid-template-columns:95px 1fr;
    gap:10px;
  }

  .related-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">MOVIE<span>BASE</span></div>

  <div class="search">
    <input id="searchInput" type="search" placeholder="Search movies & TV shows...">
  </div>

  <div class="header-actions">
    <button class="icon-btn" id="randomOpen" title="Random Picker">⌘</button>
  </div>
</header>

<main id="home">

  <!-- TRENDING -->
  <section>
    <div class="section-title">
      <div>
        <h2>Trending Recommendations</h2>
        <p>Movies & TV Shows</p>
      </div>
    </div>

    <div class="trending-box" id="trendingBox">
      <div class="trending-info" id="trendingInfo">
        <span class="badge">Trending</span>
        <h1>Loading...</h1>
      </div>

      <div class="trending-image">
        <img id="trendingImage" src="" alt="">
      </div>

      <div class="trending-nav">
        <button id="trendPrev" aria-label="Previous">&lt;</button>
        <button id="trendNext" aria-label="Next">&gt;</button>
      </div>
    </div>
  </section>

  <!-- BROWSE BY -->
  <section>
    <div class="section-title">
      <div>
        <h2>Browse by Type</h2>
      </div>
    </div>

    <div class="browse-box">
      <div class="browse-row">

        <span class="browse-label">BROWSE BY</span>

        <div class="filter-wrap">
          <select class="filter-select" id="yearSelect">
            <option value="">YEAR ▾</option>
          </select>
        </div>

        <div class="filter-wrap">
          <select class="filter-select" id="popularSelect">
            <option value="">POPULAR ▾</option>
            <option value="any">Any</option>
            <option value="all">All Time Popular</option>
          </select>
        </div>

        <div class="filter-wrap">
          <select class="filter-select" id="genreSelect">
            <option value="">GENRE ▾</option>
          </select>
        </div>

        <div class="filter-wrap">
          <select class="filter-select" id="typeSelect">
            <option value="all">MOVIES + TV SHOWS ▾</option>
            <option value="movie">MOVIES</option>
            <option value="tv">TV SHOWS</option>
          </select>
        </div>

      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section>

<script>
/* =========================================================
   TMDB CONFIG
========================================================= */

const API_KEY = "9c95420163879f1c4726c540b305cbc6";
const API_BASE = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/";
const POSTER = IMG + "w500";
const BACKDROP = IMG + "original";
const PROFILE = IMG + "w185";

/*
  Bollywood is handled separately because TMDB's Hindi/Indian
  content is better represented by multiple discover parameters.
*/

const state = {
  page: 1,
  totalPages: 1,
  items: [],
  seenIds: new Set(),
  currentDetails: null,
  currentSeason: 1,
  trending: [],
  trendIndex: 0,
  genreMap: {
    movie: new Map(),
    tv: new Map()
  }
};

/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function yearFrom(item){
  const date = item.release_date || item.first_air_date || "";
  return date ? date.slice(0,4) : "—";
}

function releaseDate(item){
  return item.release_date || item.first_air_date || "";
}

function displayTitle(item){
  return item.title || item.name || "Untitled";
}

function mediaType(item){
  return item.media_type || (item.first_air_date ? "tv" : "movie");
}

function imageUrl(path, size="w500"){
  return path ? IMG + size + path : "";
}

function showToast(message){
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => {
    toast.classList.remove("show");
  },2200);
}

async function api(path, params={}){
  const url = new URL(API_BASE + path);
  url.searchParams.set("api_key", API_KEY);
  url.searchParams.set("language","en-US");

  Object.entries(params).forEach(([key,value])=>{
    if(value !== undefined && value !== null && value !== ""){
      url.searchParams.set(key,value);
    }
  });

  const response = await fetch(url);

  if(!response.ok){
    throw new Error("TMDB request failed");
  }

  return response.json();
}

/* =========================================================
   GENRES
========================================================= */

async function loadGenres(){
  try{
    const [movies,tv] = await Promise.all([
      api("/genre/movie/list"),
      api("/genre/tv/list")
    ]);

    movies.genres.forEach(g=>state.genreMap.movie.set(g.id,g.name));
    tv.genres.forEach(g=>state.genreMap.tv.set(g.id,g.name));

    const combined = new Map();

    movies.genres.forEach(g=>combined.set(g.id,g.name));
    tv.genres.forEach(g=>combined.set(g.id,g.name));

    const selects = [$("genreSelect"),$("randomGenre")];

    selects.forEach(select=>{
      [...combined.entries()]
        .sort((a,b)=>a[1].localeCompare(b[1]))
        .forEach(([id,name])=>{
          const option = document.createElement("option");
          option.value = id;
          option.textContent = name;
          select.appendChild(option);
        });

      /* Bollywood */
      const bollywood = document.createElement("option");
      bollywood.value = "bollywood";
      bollywood.textContent = "Bollywood";
      select.appendChild(bollywood);
    });

  }catch(error){
    console.error(error);
  }
}

/* =========================================================
   YEARS
========================================================= */

function loadYears(){
  const current = new Date().getFullYear();

  for(let year=current;year>=1970;year--){
    const option = document.createElement("option");
    option.value = year;
    option.textContent = year;
    $("yearSelect").appendChild(option);
  }
}

/* =========================================================
   TRENDING
========================================================= */

async function loadTrending(){
  try{
    const data = await api("/trending/all/week");

    state.trending = (data.results || [])
      .filter(x => x.poster_path || x.backdrop_path)
      .slice(0,12);

    renderTrending();

  }catch(error){
    console.error(error);
  }
}

function renderTrending(){
  if(!state.trending.length)return;

  const item = state.trending[state.trendIndex];

  const title = displayTitle(item);
  const type = mediaType(item)==="tv" ? "TV Show" : "Movie";
  const date = releaseDate(item) || "Release date unavailable";
  const rating = Number(item.vote_average || 0).toFixed(1);

  $("trendingInfo").innerHTML = `
    <span class="badge">${type}</span>
    <h1>${esc(title)}</h1>

    <div class="trending-meta">
      <span>Release: ${esc(date)}</span>
      <span>★ ${rating}</span>
    </div>

    <p class="trending-overview">
      ${esc(item.overview || "No overview available.")}
    </p>
  `;

  $("trendingImage").src =
    item.backdrop_path
      ? BACKDROP + item.backdrop_path
      : imageUrl(item.poster_path,"w1280");

  $("trendingBox").onclick = event=>{
    if(event.target.closest(".trending-nav"))return;
    openDetails(item.id,type==="TV Show"?"tv":"movie");
  };
}

function nextTrending(){
  if(!state.trending.length)return;

  state.trendIndex =
    (state.trendIndex + 1) % state.trending.length;

  renderTrending();
}

function prevTrending(){
  if(!state.trending.length)return;

  state.trendIndex =
    (state.trendIndex - 1 + state.trending.length) %
    state.trending.length;

  renderTrending();
}

$("trendNext").addEventListener("click",e=>{
  e.stopPropagation();
  nextTrending();
});

$("trendPrev").addEventListener("click",e=>{
  e.stopPropagation();
  prevTrending();
});

/* =========================================================
   DISCOVER
========================================================= */

function getSelectedFilters(){
  return {
    year: $("yearSelect").value,
    popular: $("popularSelect")?.value || $("popularSelect").value,
    genre: $("genreSelect").value,
    type: $("typeSelect").value
  };
}

async function discoverPage(page=1){
  const type = $("typeSelect").value;
  const year = $("yearSelect").value;
  const genre = $("genreSelect").value;
  const popular = $("popularSelect").value;

  state.page = page;

  $("resultsGrid").innerHTML =
    `<div style="grid-column:1/-1;padding:50px;text-align:center;color:#9299a6">Loading...</div>`;

  try{
    let result;

    if(type === "all"){
      const movie = await discoverMedia("movie",page,year,genre,popular);
      const tv = await discoverMedia("tv",page,year,genre,popular);

      const combined = [
        ...(movie.results || []).map(x=>({...x,media_type:"movie"})),
        ...(tv.results || []).map(x=>({...x,media_type:"tv"}))
      ];

      /*
        Remove duplicates by media type + ID.
      */
      const unique = [];
      const keys = new Set();

      for(const item of combined){
        const key = `${mediaType(item)}-${item.id}`;

        if(!keys.has(key)){
          keys.add(key);
          unique.push(item);
        }
      }

      unique.sort((a,b)=>
        (b.popularity || 0)-(a.popularity || 0)
      );

      result = {
        results:unique.slice(0,50),
        total_pages:Math.max(movie.total_pages || 1,tv.total_pages || 1)
      };

    }else{
      result = await discoverMedia(
        type,page,year,genre,popular
      );
    }

    state.items = result.results || [];
    state.totalPages = Math.min(
      result.total_pages || 1,
      500
    );

    renderResults();
    renderPagination();

  }catch(error){
    console.error(error);

    $("resultsGrid").innerHTML =
      `<div style="grid-column:1/-1;padding:50px;text-align:center;color:#ff7b8c">
        Unable to load data. Please try again.
      </div>`;
  }
}

async function discoverMedia(type,page,year,genre,popular){
  const params = {
    page,
    include_adult:false,
    include_video:false
  };

  if(year){
    if(type==="movie") params.primary_release_year = year;
    else params.first_air_date_year = year;
  }

  if(genre && genre !== "bollywood"){
    params.with_genres = genre;
  }

  if(genre === "bollywood"){
    params.with_original_language = "hi";
    params.region = "IN";
  }

  if(popular === "all"){
    params.sort_by = "popularity.desc";
  }else{
    params.sort_by = "popularity.desc";
  }

  return api(
    type==="movie"
      ? "/discover/movie"
      : "/discover/tv",
    params
  );
}

/* =========================================================
   RESULTS RENDER
========================================================= */

function renderResults(){
  const grid = $("resultsGrid");

  const unique = [];
  const keys = new Set();

  for(const item of state.items){
    const key = `${mediaType(item)}-${item.id}`;

    if(!keys.has(key)){
      keys.add(key);
      unique.push(item);
    }
  }

  grid.innerHTML = unique.map(item=>{
    const type = mediaType(item);
    const title = displayTitle(item);
    const date = releaseDate(item);
    const rating = Number(item.vote_average || 0).toFixed(1);

    return `
      <article class="card"
        data-id="${item.id}"
        data-type="${type}">

        <div class="poster">
          ${
            item.poster_path
              ? `<img loading="lazy"
                    src="${POSTER + item.poster_path}"
                    alt="${esc(title)}">`
              : `<div style="height:100%;display:grid;place-items:center;color:#707784;font-size:12px">
                   No Poster
                 </div>`
          }
        </div>

        <div class="card-info">
          <div class="card-title">${esc(title)}</div>

          <div class="card-meta">
            <span>${date ? esc(date.slice(0,4)) : "—"}</span>
            <span class="rating">★ ${rating}</span>
          </div>
        </div>

      </article>
    `;
  }).join("");

  grid.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click",()=>{
      openDetails(
        Number(card.dataset.id),
        card.dataset.type
      );
    });
  });

  $("resultsCount").textContent =
    `${unique.length} results`;

  $("resultsTitle").textContent =
    $("typeSelect").value === "tv"
      ? "TV Shows"
      : $("typeSelect").value === "movie"
      ? "Movies"
      : "Movies & TV Shows";
}

/* =========================================================
   PAGINATION
   Only Back / numbered pages / Next.
   No total pages text.
========================================================= */

function renderPagination(){
  const pagination = $("pagination");

  if(state.totalPages <= 1){
    pagination.innerHTML = "";
    return;
  }

  const current = state.page;
  const total = state.totalPages;

  const pages = new Set();

  pages.add(1);
  pages.add(total);

  for(let i=current-2;i<=current+2;i++){
    if(i>0 && i<=total){
      pages.add(i);
    }
  }

  const sorted = [...pages].sort((a,b)=>a-b);

  let html = `
    <button ${current===1?"disabled":""}
      data-page="${current-1}">
      Back
    </button>
  `;

  let previous = 0;

  sorted.forEach(page=>{
    if(previous && page-previous>1){
      html += `<span style="color:#717783">…</span>`;
    }

    html += `
      <button
        class="${page===current?"active":""}"
        data-page="${page}">
        ${page}
      </button>
    `;

    previous = page;
  });

  html += `
    <button ${current===total?"disabled":""}
      data-page="${current+1}">
      Next
    </button>
  `;

  pagination.innerHTML = html;

  pagination.querySelectorAll("button:not(:disabled)")
    .forEach(button=>{
      button.addEventListener("click",()=>{
        const page = Number(button.dataset.page);

        if(page<1 || page>total)return;

        discoverPage(page);

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });
      });
    });
}

/* =========================================================
   DETAILS
========================================================= */

async function openDetails(id,type){
  $("detailsOverlay").classList.remove("hidden");
  document.body.style.overflow="hidden";

  $("detailsOverlay").innerHTML = `
    <div style="min-height:100vh;display:grid;place-items:center;color:#999">
      Loading...
    </div>
  `;

  try{
    const details = await api(`/${type}/${id}`,{
      append_to_response:"credits,external_ids,images"
    });

    state.currentDetails = {
      ...details,
      media_type:type
    };

    renderDetails(details,type);

  }catch(error){
    console.error(error);

    $("detailsOverlay").innerHTML = `
      <div style="padding:50px;text-align:center">
        Unable to load details.
        <br><br>
        <button onclick="closeDetails()">Close</button>
      </div>
    `;
  }
}

function closeDetails(){
  $("detailsOverlay").classList.add("hidden");
  $("detailsOverlay").innerHTML="";
  document.body.style.overflow="";
}

window.closeDetails = closeDetails;

function renderDetails(item,type){

  const backdrop =
    item.backdrop_path

      : imageUrl(item.poster_path,"w1280");

  const poster =
    item.poster_path
      ? POSTER + item.poster_path
      : "";

  const cast = item.credits?.cast || [];

  $("detailsOverlay").innerHTML = `
    <div class="details-page">

      <div class="details-backdrop">
        <img src="${backdrop}" alt="${esc(title)}">

        <button class="close-details" onclick="closeDetails()">×</button>
      </div>

      <div class="details-content">

        <div class="details-top">

          <div class="details-poster">
            ${
              poster
                ? `<img src="${poster}" alt="${esc(title)}">`
                : ""
            }
          </div>

          <div class="details-info">

            <div class="details-type">
              ${type==="tv" ? "TV Show" : "Movie"}
            </div>

            <h1>${esc(title)}</h1>

            <div class="details-meta">
              ${
                date
                  ? `<span>Release: ${esc(date)}</span>`
                  : ""
              }

              ${
                type==="movie"
                  ? `<span>${item.runtime || "—"} min</span>`
                  : `<span>${item.number_of_seasons || 0} Seasons</span>
                     <span>${item.number_of_episodes || 0} Episodes</span>`
              }

              ${
                item.genres?.length
                  ? `<span>${esc(item.genres.map(g=>g.name).join(" • "))}</span>`
                  : ""
              }
            </div>

            <div class="details-rating">
              ★ ${rating}/10
            </div>

            <p class="details-overview">
              ${esc(item.overview || "No overview available.")}
            </p>

            <div class="details-actions">
              <button class="primary"
                onclick="markWatched('${type}',${item.id})">
                Mark as Watched
              </button>

              <button
                onclick="scheduleWatch('${type}',${item.id})">
                Schedule to Watch
              </button>

              <button
                onclick="addWatchlist('${type}',${item.id})">
                Watchlist
              </button>
            </div>

          </div>

        </div>

        ${
          type==="tv"
            ? `
              <section class="seasons-section">
                <div class="section-title">
                  <div>
                    <h2>Episodes</h2>
                    <p>All seasons, dates, ratings and original thumbnails</p>
                  </div>
                </div>

                <select
                  class="season-select"
                  id="seasonSelect">
                  ${Array.from(
                    {length:item.number_of_seasons || 0},
                    (_,i)=>`
                      <option value="${i+1}">
                        Season ${i+1}
                      </option>
                    `
                  ).join("")}
                </select>

                <div class="episodes" id="episodes"></div>
              </section>
            `
            : ""
        }

        <section class="cast-section">
          <div class="section-title">
            <div>
              <h2>Cast</h2>
            </div>
          </div>

          <div class="cast-grid">
            ${
              cast.slice(0,30).map(person=>`
                <div class="cast-card">
                  <div class="cast-photo">
                    ${
                      person.profile_path
                        ? `<img loading="lazy"
                             src="${PROFILE + person.profile_path}"
                             alt="${esc(person.name)}">`
                        : ""
                    }
                  </div>

                  <div class="cast-name">
                    ${esc(person.name)}
                  </div>

                  <div class="cast-character">
                    ${esc(person.character || "")}
                  </div>
                </div>
              `).join("")
            }
          </div>
        </section>

        <section class="related-section">
          <div class="section-title">
            <div>
              <h2>Related & Franchise</h2>
              <p>More titles related to this movie or TV show</p>
            </div>
          </div>

          <div class="related-grid" id="relatedGrid"></div>

  `;

  if(type==="tv"){
    $("seasonSelect").addEventListener("change",event=>{

    });

    loadEpisodes(item.id,1);
  }

  loadRelated(item,type);
}

   TV EPISODES
========================================================= */

async function loadEpisodes(tvId,season){

  if(!container)return;

  container.innerHTML =
    `<div style="padding:20px;color:#888">Loading episodes...</div>`;

  try{
    const data = await api(
      `/tv/${tvId}/season/${season}`
    );

    const episodes = data.episodes || [];

    container.innerHTML = episodes.map(ep=>`
      <article class="episode">

        <div class="episode-thumb">
          ${
            ep.still_path
              ? `<img loading="lazy"
                   src="${IMG + "w300" + ep.still_path}"
                   alt="${esc(ep.name)}">`
              : ""
          }
        </div>

        <div>
          <h4>
            ${ep.episode_number}. ${esc(ep.name || "Episode")}
          </h4>

          <p>
            ${ep.air_date || "Date unavailable"}
          </p>

          <p style="margin-top:5px">
            ${esc(ep.overview || "No episode overview available.")}
          </p>
        </div>

        <div class="episode-rating">

        </div>

      </article>

      </div>`;
  }
}

/* =========================================================
   RELATED / FRANCHISE
========================================================= */

async function loadRelated(item,type){
  const grid = $("relatedGrid");

  if(!grid)return;

  grid.innerHTML =
    `<div style="grid-column:1/-1;color:#888">Loading...</div>`;

  try{
    let items=[];

    if(type==="movie"){
      const recommendations =
        await api(`/movie/${item.id}/recommendations`);

      items = recommendations.results || [];

      /*
        Also use collection/franchise movies when available.
      */
      if(item.belongs_to_collection?.id){
        const collection =
          await api(`/collection/${item.belongs_to_collection.id}`);

        const collectionItems =
          collection.parts || [];

        items = [
          ...collectionItems,
          ...items
        ];
      }

    }else{
      const recommendations =
        await api(`/tv/${item.id}/recommendations`);

      items = recommendations.results || [];
    }

    const unique=[];
    const keys=new Set();

    for(const x of items){
      const key=`${type}-${x.id}`;

      if(
        x.id !== item.id &&
        !keys.has(key)
      ){
        keys.add(key);
        unique.push({
          ...x,
          media_type:type
        });
      }
    }

    grid.innerHTML =
      unique.slice(0,12).map(x=>relatedCard(x,type)).join("");

    grid.querySelectorAll(".card").forEach(card=>{
      card.addEventListener("click",()=>{
        openDetails(
          Number(card.dataset.id),
          card.dataset.type
        );
      });
    });

  }catch(error){
    console.error(error);
    grid.innerHTML="";
  }
}

function relatedCard(item,type){
  return `
    <article class="card"
      data-id="${item.id}"
      data-type="${type}">

      <div class="poster">
        ${
          item.poster_path
            ? `<img loading="lazy"
                 src="${POSTER + item.poster_path}"
                 alt="${esc(displayTitle(item))}">`
            : ""
        }
      </div>

      <div class="card-info">
        <div class="card-title">
          ${esc(displayTitle(item))}
        </div>

        <div class="card-meta">
          <span>${yearFrom(item)}</span>
          <span class="rating">
            ★ ${Number(item.vote_average || 0).toFixed(1)}
          </span>
        </div>
      </div>

    </article>
  `;
}

/* =========================================================
   RANDOM PICKER
========================================================= */

function openRandom(){
  $("randomOverlay").classList.remove("hidden");
  document.body.style.overflow="hidden";
}

function closeRandom(){
  $("randomOverlay").classList.add("hidden");
  document.body.style.overflow="";
}

$("randomOpen").addEventListener("click",openRandom);
$("randomClose").addEventListener("click",closeRandom);

async function pickRandom(){
  const type = $("randomType").value;
  const popularity = $("randomPopularity").value;
  const genre = $("randomGenre").value;

  const result = $("randomResult");

  result.classList.remove("show");

  try{
    let pool=[];

    const types =
      type==="all"
        ? ["movie","tv"]
        : [type];

    /*
      Multiple pages are sampled so the picker isn't limited
      to only the first 20 TMDB results.
    */

    for(const currentType of types){

      let params={
        page:Math.floor(Math.random()*5)+1,
        include_adult:false,
        include_video:false,
        sort_by:"popularity.desc"
      };

      if(genre && genre!=="bollywood"){
        params.with_genres=genre;
      }

      if(genre==="bollywood"){
        /*
          Hindi language + India region gives usable
          Bollywood results for both movies and TV shows.
        */
        params.with_original_language="hi";
        params.region="IN";
      }

      if(popularity==="any"){
        params.sort_by="popularity.desc";
      }else{
        params.sort_by="popularity.desc";
      }

      const data = await api(
        currentType==="movie"
          ? "/discover/movie"
          : "/discover/tv",
        params
      );

      (data.results || []).forEach(x=>{
        if(x.poster_path){
          pool.push({
            ...x,
            media_type:currentType
          });
        }
      });
    }

    /*
      If Bollywood query returns no result, try a wider Hindi
      fallback instead of leaving picker broken.
    */
    if(!pool.length && genre==="bollywood"){
      for(const currentType of types){
        const data=await api(
          currentType==="movie"
            ? "/discover/movie"
            : "/discover/tv",
          {
            page:1,
            with_original_language:"hi",
            sort_by:"popularity.desc",
            include_adult:false
          }
        );

        (data.results||[]).forEach(x=>{
          if(x.poster_path){
            pool.push({
              ...x,
              media_type:currentType
            });
          }
        });
      }
    }

    if(!pool.length){
      showToast("No matching title found.");
      return;
    }

    const unique=[];
    const keys=new Set();

    pool.forEach(x=>{
      const key=`${x.media_type}-${x.id}`;

      if(!keys.has(key)){
        keys.add(key);
        unique.push(x);
      }
    });

    const item =
      unique[Math.floor(Math.random()*unique.length)];

    $("randomPoster").src =
      POSTER + item.poster_path;

    $("randomTitle").textContent =
      displayTitle(item);

    $("randomTypeText").textContent =
      item.media_type==="tv"
        ? "TV Show"
        : "Movie";

    $("randomMeta").innerHTML = `
      <span>
        Release: ${esc(releaseDate(item) || "—")}
      </span>

      <span class="rating">
        ★ ${Number(item.vote_average || 0).toFixed(1)}
      </span>
    `;

    $("randomOverview").textContent =
      item.overview || "No overview available.";

    result.classList.add("show");

    /*
      Entire random result card opens details.
    */
    result.onclick=()=>{
      closeRandom();
      openDetails(item.id,item.media_type);
    };

  }catch(error){
    console.error(error);
    showToast("Unable to pick a title.");
  }
}

$("pickRandom").addEventListener("click",pickRandom);

/* =========================================================
   WATCHED / SCHEDULED / WATCHLIST
========================================================= */

function getStorage(key){
  try{
    return JSON.parse(localStorage.getItem(key) || "[]");
  }catch{
    return [];
  }
}

function saveStorage(key,data){
  localStorage.setItem(key,JSON.stringify(data));
}

function datePicker(title,callback){
  /*
    Native date input keeps the selection simple on mobile
    and allows both date + year selection.
  */
  const old = document.getElementById("dateDialog");

  if(old)old.remove();

  const dialog=document.createElement("div");

  dialog.id="dateDialog";

  dialog.style.cssText=`
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.78);
    display:grid;
    place-items:center;
    padding:20px;
  `;

  dialog.innerHTML=`
    <div style="
      width:min(380px,100%);
      background:#11161c;
      border:1px solid #29303a;
      border-radius:14px;
      padding:20px;
    ">
      <h3 style="margin:0 0 14px">${esc(title)}</h3>

      <input id="selectedDate"
        type="date"
        style="
          width:100%;
          height:44px;
          border-radius:9px;
          border:1px solid #29303a;
          background:#181d24;
          color:white;
          padding:0 10px;
        ">

      <div style="
        display:flex;
        justify-content:flex-end;
        gap:8px;
        margin-top:15px;
      ">
        <button id="cancelDate"
          style="
            height:38px;
            padding:0 14px;
            border-radius:8px;
            border:1px solid #29303a;
            background:#171c22;
            color:white;
          ">
          Cancel
        </button>

        <button id="okDate"
          style="
            height:38px;
            padding:0 16px;
            border-radius:8px;
            border:0;
            background:#e7ff4f;
            color:#101300;
            font-weight:900;
          ">
          OK
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(dialog);

  $("cancelDate").onclick=()=>dialog.remove();

  $("okDate").onclick=()=>{
    const value=$("selectedDate").value;

    if(!value){
      showToast("Select a date first.");
      return;
    }

    callback(value);
    dialog.remove();
  };
}

window.markWatched=function(type,id){
  const item=state.currentDetails;

  datePicker(
    "When did you watch it?",
    date=>{
      const watched=getStorage("watched");

      const entry={
        id,
        type,
        title:displayTitle(item),
        poster_path:item.poster_path,
        backdrop_path:item.backdrop_path,
        date
      };

      const index=watched.findIndex(
        x=>x.id===id && x.type===type
      );

      if(index>=0){
        watched[index]=entry;
      }else{
        watched.push(entry);
      }

      saveStorage("watched",watched);

      showToast(`Marked watched: ${date}`);
    }
  );
};

window.scheduleWatch=function(type,id){
  const item=state.currentDetails;

  datePicker(
    "When do you want to watch it?",
    date=>{
      const scheduled=getStorage("scheduled");

      const entry={
        id,
        type,
        title:displayTitle(item),
        poster_path:item.poster_path,
        backdrop_path:item.backdrop_path,
        date
      };

      const index=scheduled.findIndex(
        x=>x.id===id && x.type===type
      );

      if(index>=0){
        scheduled[index]=entry;
      }else{
        scheduled.push(entry);
      }

      saveStorage("scheduled",scheduled);

      showToast(`Scheduled: ${date}`);
    }
  );
};

window.addWatchlist=function(type,id){
  const item=state.currentDetails;

  const list=getStorage("watchlist");

  const exists=list.some(
    x=>x.id===id && x.type===type
  );

  if(exists){
    showToast("Already in watchlist.");
    return;
  }

  list.push({
    id,
    type,
    title:displayTitle(item),
    poster_path:item.poster_path,
    date:new Date().toISOString().slice(0,10)
  });

  saveStorage("watchlist",list);

  showToast("Added to watchlist.");
};

/* =========================================================
   SEARCH
========================================================= */

let searchTimer=null;

$("searchInput").addEventListener("input",event=>{
  clearTimeout(searchTimer);

  const query=event.target.value.trim();

  if(!query){
    discoverPage(1);
    return;
  }

  searchTimer=setTimeout(
    ()=>search(query),
    450
  );
});

async function search(query){
  $("resultsGrid").innerHTML=
    `<div style="grid-column:1/-1;padding:50px;text-align:center;color:#888">
      Searching...
    </div>`;

  try{
    const data=await api("/search/multi",{
      query,
      page:1,
      include_adult:false
    });

    state.items=(data.results||[])
      .filter(x=>x.media_type==="movie" || x.media_type==="tv")
      .filter((x,i,a)=>
        a.findIndex(y=>
          y.media_type===x.media_type &&
          y.id===x.id
        )===i
      );

    state.page=1;
    state.totalPages=data.total_pages || 1;

    renderResults();
    renderPagination();

  }catch(error){
    console.error(error);
  }
}

/* =========================================================
   FILTER EVENTS
========================================================= */

["yearSelect","popularSelect","genreSelect","typeSelect"]
.forEach(id=>{
  $(id).addEventListener("change",()=>{
    discoverPage(1);
  });
});

/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    if(!$("randomOverlay").classList.contains("hidden")){
      closeRandom();
      return;
    }

    if(!$("detailsOverlay").classList.contains("hidden")){
      closeDetails();
    }
  }
});

/* =========================================================
   TOP BUTTON
========================================================= */

window.addEventListener("scroll",()=>{
  if(window.scrollY>500){
    $("toTop").classList.add("show");
  }else{
    $("toTop").classList.remove("show");
  }
});

$("toTop").addEventListener("click",()=>{
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
});

   INIT
========================================================= */

async function init(){
  loadYears();
  await loadGenres();

  await Promise.all([
    loadTrending(),
    discoverPage(1)
  ]);
}

init();
