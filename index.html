<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie & TV Tracker</title>

<style>
:root{
  --bg:#090b10;
  --panel:#11141b;
  --card:#141820;
  --border:#252b36;
  --text:#f4f6f8;
  --muted:#9299a6;
  --gold:#f5c518;
  --shadow:0 14px 40px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.035),transparent 30%),var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,select{font:inherit;}
button{cursor:pointer;}
a{color:inherit;text-decoration:none;}
.hidden{display:none!important;}

/* HEADER & SEARCH */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(9,11,16,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav{
  max-width:1450px;
  margin:auto;
  min-height:65px;
  padding:10px 22px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{font-size:20px;font-weight:800;cursor:pointer;}
.logo span{color:#9ca3af;}

.search-wrap{
  position:relative;
  width:260px; /* Small & Compact Search Box */
}

.search{
  width:100%;
  background:#151922;
  border:1px solid var(--border);
  border-radius:10px;
  color:white;
  outline:none;
  padding:8px 12px 8px 34px;
  font-size:13px;
}

.search-icon{
  position:absolute;
  left:11px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:13px;
}

/* SEARCH DROPDOWN */
.search-dropdown{
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  right:0;
  background:#141822;
  border:1px solid var(--border);
  border-radius:12px;
  max-height:360px;
  overflow-y:auto;
  z-index:2000;
  box-shadow:0 15px 35px rgba(0,0,0,.5);
}

.search-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.04);
  cursor:pointer;
}

.search-item:hover{background:#1c222e;}
.search-item img{width:36px;height:52px;object-fit:cover;border-radius:6px;background:#202530;}
.search-item-info{min-width:0;}
.search-item-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-item-meta{font-size:11px;color:var(--muted);margin-top:2px;}

.nav-actions{margin-left:auto;display:flex;gap:8px;}
.nav-btn{border:1px solid var(--border);background:#131720;color:#d9dde4;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;}
.nav-btn:hover{background:#1b202a;}

/* LAYOUT VIEWS */
.container{max-width:1450px;margin:auto;padding:26px 22px 80px;}
.section{margin-bottom:34px;}
.section-title{font-size:21px;margin:0 0 12px;font-weight:800;}

/* TRENDING */
.trending{position:relative;overflow:hidden;min-height:360px;border-radius:20px;border:1px solid var(--border);background:#10131a;}
.trend-slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .55s ease;}
.trend-slide.active{opacity:1;pointer-events:auto;}
.trend-bg{position:absolute;z-index:1;top:0;right:0;width:55%;height:100%;object-fit:cover;}
.trend-overlay{position:absolute;z-index:2;inset:0;background:linear-gradient(90deg,#10131a 0%,rgba(16,19,26,.95) 50%,transparent 100%);}
.trend-content{position:relative;z-index:3;min-height:360px;width:50%;padding:35px;display:flex;justify-content:center;flex-direction:column;}
.trend-title{font-size:36px;margin:0 0 10px;line-height:1.1;}
.trend-meta{display:flex;gap:10px;color:#d7dbe1;font-size:13px;margin-bottom:12px;}
.rating{color:var(--gold);font-weight:800;}
.trend-overview{color:#b0b7c3;line-height:1.5;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.trend-btn{margin-top:16px;padding:9px 16px;border:0;border-radius:8px;background:#fff;color:#000;font-weight:700;width:max-content;}

/* GRID & CARDS */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px;}
.movie-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;}
.poster-wrap{aspect-ratio:2/3;background:#1b2029;position:relative;}
.poster{width:100%;height:100%;object-fit:cover;}
.card-body{padding:10px;}
.card-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{display:flex;justify-content:space-between;color:var(--muted);margin-top:6px;font-size:11px;}

/* TIMELINE DASHBOARD */
.timeline-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.timeline-column{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;}
.timeline-header{font-size:16px;font-weight:800;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.timeline-list{display:flex;flex-direction:column;gap:12px;}
.timeline-card{display:flex;gap:12px;background:#161a24;border:1px solid var(--border);border-radius:10px;padding:8px;align-items:center;}
.timeline-card img{width:45px;height:65px;object-fit:cover;border-radius:6px;}
.timeline-card-info{flex:1;min-width:0;}
.timeline-card-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.timeline-card-date{font-size:11px;color:var(--muted);margin-top:4px;}

/* RANDOM PICKER FULL PAGE */
.picker-container{max-width:550px;margin:40px auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:24px;}
.picker-options{display:flex;flex-direction:column;gap:16px;margin-top:15px;}
.radio-row{display:flex;gap:8px;}
.choice{border:1px solid #2d333e;background:#181d25;color:#dfe3e8;border-radius:8px;padding:8px 14px;font-size:12px;}
.choice.active{background:var(--gold);color:#111318;border-color:var(--gold);font-weight:800;}
.pick-btn{width:100%;margin-top:15px;border:0;border-radius:10px;background:#fff;color:#000;padding:12px;font-weight:800;font-size:14px;}
.random-result-card{margin-top:20px;background:#161b24;border:1px solid var(--border);border-radius:14px;padding:16px;display:none;gap:16px;cursor:pointer;}
.random-result-card.show{display:flex;}
.random-result-card img{width:110px;height:165px;object-fit:cover;border-radius:10px;}
.random-result-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}

/* DETAILS PAGE */
.detail-hero{min-height:420px;position:relative;display:flex;align-items:flex-end;}
.detail-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.detail-overlay-bg{position:absolute;inset:0;background:linear-gradient(0deg,#090b10 10%,transparent 100%),linear-gradient(90deg,#090b10 30%,transparent 90%);}
.detail-main{position:relative;z-index:2;display:flex;gap:24px;padding:30px 22px;align-items:flex-end;max-width:1450px;margin:auto;}
.detail-poster{width:180px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.1);}
.detail-info{flex:1;}

/* OTT PROVIDERS */
.providers{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.provider{display:flex;align-items:center;gap:8px;background:#151922;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;}
.provider img{width:24px;height:24px;border-radius:5px;}

/* SEASONS & EPISODES */
.season-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:15px;}
.season-btn{white-space:nowrap;background:#161a22;border:1px solid var(--border);color:#cfd4db;border-radius:8px;padding:8px 12px;font-size:12px;}
.season-btn.active{background:#fff;color:#000;font-weight:800;}
.episodes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.episode{display:flex;gap:12px;background:#13171e;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.episode img{width:140px;aspect-ratio:16/9;object-fit:cover;}
.episode-info{padding:10px;flex:1;min-width:0;}
.episode-name{font-size:12px;font-weight:800;}
.episode-overview{font-size:11px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* RESPONSIVE */
@media(max-width:900px){
  .grid{grid-template-columns:repeat(3,1fr);}
  .timeline-grid{grid-template-columns:1fr;}
  .episodes{grid-template-columns:1fr;}
  .search-wrap{width:180px;}
}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);}
  .detail-main{flex-direction:column;align-items:flex-start;}
  .trend-content{width:100%;}
  .trend-bg{width:100%;opacity:.3;}
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo" onclick="switchView('main')">Movie<span>Tracker</span></div>

    <!-- Top Search Box -->
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="searchInput" class="search" type="search" placeholder="Search..." autocomplete="off">
      <div id="searchDropdown" class="search-dropdown hidden"></div>
    </div>

    <div class="nav-actions">
      <button class="nav-btn" onclick="switchView('timeline')">Timeline</button>
      <button class="nav-btn" onclick="switchView('random')">🎲 Random</button>
    </div>
  </div>
</header>

<!-- MAIN VIEW -->
<div id="viewMain" class="container view-page">
  <section class="section">
    <h1 class="section-title">Trending Recommendations</h1>
    <div id="trendingBox" class="trending"></div>
  </section>

  <section class="section">
    <h2 class="section-title">Discover</h2>
    <div id="results" class="grid"></div>
  </section>
</div>

<!-- TIMELINE VIEW -->
<div id="viewTimeline" class="container view-page hidden">
  <h1 class="section-title">Your Watch Timeline</h1>
  <div class="timeline-grid">
    <div class="timeline-column">
      <div class="timeline-header">Watched</div>
      <div id="watchedTimeline" class="timeline-list"></div>
    </div>
    <div class="timeline-column">
      <div class="timeline-header">Scheduled</div>
      <div id="scheduledTimeline" class="timeline-list"></div>
    </div>
  </div>
</div>

<!-- RANDOM PICKER VIEW -->
<div id="viewRandom" class="container view-page hidden">
  <div class="picker-container">
    <h1 class="section-title" style="text-align:center;">🎲 Random Picker</h1>
    
    <div class="picker-options">
      <div>Selection Type</div>
      <div class="radio-row" id="randomType">
        <button class="choice active" data-value="all">Movies + TV</button>
        <button class="choice" data-value="movie">Movies</button>
        <button class="choice" data-value="tv">TV Shows</button>
      </div>

      <div>Genre</div>
      <select id="randomGenre" class="search" style="width:100%;">
        <option value="">Any Genre</option>
        <option value="bollywood">Bollywood</option>
        <option value="28">Action</option>
        <option value="35">Comedy</option>
        <option value="18">Drama</option>
        <option value="27">Horror</option>
        <option value="878">Sci-Fi</option>
      </select>

      <button class="pick-btn" onclick="pickRandomItem()">PICK FOR ME</button>
    </div>

    <div id="randomResult" class="random-result-card" onclick="openDetailsFromRandom()">
      <img id="randomImg" src="" alt="">
      <div class="random-result-info">
        <div id="randomTitle" style="font-size:16px;font-weight:800;"></div>
        <div id="randomMeta" style="font-size:12px;color:var(--muted);margin:6px 0;"></div>
        <div id="randomOverview" style="font-size:12px;color:#ccc;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;"></div>
      </div>
    </div>
  </div>
</div>

<!-- DETAILS VIEW -->
<div id="viewDetails" class="view-page hidden">
  <div id="detailHero" class="detail-hero"></div>
  <div class="container">
    <div id="detailContent"></div>
  </div>
</div>

<script>
const API_KEY = "9c95420163879f1c4726c540b305cbc6";
const API_BASE = "https://api.themoviedb.org/3";
const IMG_BASE = "https://image.tmdb.org/t/p/w500";

let currentRandomPick = null;

/* NAVIGATION & ROUTING (BROWSER BACK/FORWARD) */
function switchView(viewName, pushState = true) {
  document.querySelectorAll('.view-page').forEach(el => el.classList.add('hidden'));
  
  if (viewName === 'main') document.getElementById('viewMain').classList.remove('hidden');
  if (viewName === 'timeline') {
    document.getElementById('viewTimeline').classList.remove('hidden');
    renderTimelineDashboard();
  }
  if (viewName === 'random') document.getElementById('viewRandom').classList.remove('hidden');
  if (viewName === 'details') document.getElementById('viewDetails').classList.remove('hidden');

  if (pushState) {
    history.pushState({ view: viewName }, '', `#${viewName}`);
  }
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', (e) => {
  if (e.state && e.state.view) {
    if (e.state.view === 'details' && e.state.id) {
      openDetails(e.state.id, e.state.type, false);
    } else {
      switchView(e.state.view, false);
    }
  } else {
    switchView('main', false);
  }
});

/* API HELPERS */
async function api(path, params = {}) {
  const url = new URL(API_BASE + path);
  url.searchParams.set("api_key", API_KEY);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url);
  return res.json();
}

/* SEARCH WITH DROPDOWN */
let searchTimer;
const searchInput = document.getElementById('searchInput');
const searchDropdown = document.getElementById('searchDropdown');

searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) {
    searchDropdown.classList.add('hidden');
    return;
  }
  searchTimer = setTimeout(() => fetchSearchSuggestions(q), 300);
});

async function fetchSearchSuggestions(query) {
  const data = await api("/search/multi", { query });
  const results = (data.results || [])
    .filter(x => x.media_type === "movie" || x.media_type === "tv")
    .slice(0, 6);

  if (!results.length) {
    searchDropdown.classList.add('hidden');
    return;
  }

  searchDropdown.innerHTML = results.map(item => {
    const title = item.title || item.name;
    const date = item.release_date || item.first_air_date || '';
    const year = date ? date.slice(0, 4) : '';
    const poster = item.poster_path ? IMG_BASE + item.poster_path : '';
    return `
      <div class="search-item" onclick="selectSearchItem(${item.id}, '${item.media_type}')">
        <img src="${poster}" alt="">
        <div class="search-item-info">
          <div class="search-item-title">${title}</div>
          <div class="search-item-meta">${item.media_type.toUpperCase()} ${year ? '• ' + year : ''}</div>
        </div>
      </div>
    `;
  }).join('');
  searchDropdown.classList.remove('hidden');
}

function selectSearchItem(id, type) {
  searchDropdown.classList.add('hidden');
  searchInput.value = '';
  openDetails(id, type);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) {
    searchDropdown.classList.add('hidden');
  }
});

/* TRENDING & DISCOVER */
async function loadTrending() {
  const data = await api("/trending/all/day");
  const items = (data.results || []).slice(0, 5);
  const box = document.getElementById('trendingBox');
  
  box.innerHTML = items.map((item, index) => {
    const title = item.title || item.name;
    const type = item.media_type;
    return `
      <div class="trend-slide ${index === 0 ? 'active' : ''}">
        <img class="trend-bg" src="https://image.tmdb.org/t/p/original${item.backdrop_path}" alt="">
        <div class="trend-overlay"></div>
        <div class="trend-content">
          <h2 class="trend-title">${title}</h2>
          <div class="trend-meta"><span>${type.toUpperCase()}</span> <span class="rating">★ ${item.vote_average.toFixed(1)}</span></div>
          <div class="trend-overview">${item.overview}</div>
          <button class="trend-btn" onclick="openDetails(${item.id}, '${type}')">View Details</button>
        </div>
      </div>
    `;
  }).join('');
}

async function loadDiscover() {
  const data = await api("/discover/movie");
  const items = data.results || [];
  document.getElementById('results').innerHTML = items.map(item => `
    <div class="movie-card" onclick="openDetails(${item.id}, 'movie')">
      <div class="poster-wrap">
        <img class="poster" src="${IMG_BASE + item.poster_path}" alt="">
      </div>
      <div class="card-body">
        <div class="card-title">${item.title}</div>
        <div class="card-meta">
          <span>${(item.release_date||'').slice(0,4)}</span>
          <span class="rating">★ ${item.vote_average.toFixed(1)}</span>
        </div>
      </div>
    </div>
  `).join('');
}

/* DETAILS VIEW (WITH TV SEASONS & OTT LINKS) */
async function openDetails(id, type, pushState = true) {
  if (pushState) {
    history.pushState({ view: 'details', id, type }, '', `#${type}-${id}`);
  }
  switchView('details', false);

  const [details, providers] = await Promise.all([
    api(`/${type}/${id}`),
    api(`/${type}/${id}/watch/providers`)
  ]);

  const title = details.title || details.name;
  const release = details.release_date || details.first_air_date || '';

  document.getElementById('detailHero').innerHTML = `
    <img class="detail-bg" src="https://image.tmdb.org/t/p/original${details.backdrop_path}" alt="">
    <div class="detail-overlay-bg"></div>
    <div class="detail-main">
      <img class="detail-poster" src="${IMG_BASE + details.poster_path}" alt="">
      <div class="detail-info">
        <h1 style="font-size:36px;margin:0 0 10px;">${title}</h1>
        <div style="color:var(--muted);margin-bottom:10px;">${release.slice(0,4)} • ★ ${details.vote_average.toFixed(1)}</div>
        <div style="max-width:700px;line-height:1.5;">${details.overview}</div>
      </div>
    </div>
  `;

  let html = '';

  // OTT Provider Links
  const ottData = providers.results?.IN || providers.results?.US;
  if (ottData && (ottData.flatrate || ottData.link)) {
    html += `<section class="section"><h2>Where to Watch</h2><div class="providers">`;
    const list = ottData.flatrate || [];
    list.forEach(p => {
      html += `
        <a class="provider" href="${ottData.link}" target="_blank">
          <img src="${IMG_BASE + p.logo_path}" alt="">
          <span>${p.provider_name}</span>
        </a>
      `;
    });
    html += `</div></section>`;
  }

  // TV Seasons & Episodes (Specials LAST)
  if (type === 'tv' && details.seasons) {
    let seasons = [...details.seasons];
    const specials = seasons.filter(s => s.season_number === 0);
    const regularSeasons = seasons.filter(s => s.season_number > 0).sort((a,b) => a.season_number - b.season_number);
    const orderedSeasons = [...regularSeasons, ...specials];

    html += `
      <section class="section">
        <h2>Seasons & Episodes</h2>
        <div class="season-bar">
          ${orderedSeasons.map((s, i) => `
            <button class="season-btn ${i===0?'active':''}" onclick="loadSeasonEpisodes(${id}, ${s.season_number}, this)">
              ${s.name}
            </button>
          `).join('')}
        </div>
        <div id="episodesBox"></div>
      </section>
    `;
  }

  document.getElementById('detailContent').innerHTML = html;

  if (type === 'tv' && details.seasons.length) {
    const firstSeasonNum = details.seasons.find(s=>s.season_number>0)?.season_number || 0;
    loadSeasonEpisodes(id, firstSeasonNum);
  }
}

async function loadSeasonEpisodes(tvId, seasonNum, btn) {
  if(btn) {
    document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  const data = await api(`/tv/${tvId}/season/${seasonNum}`);
  const box = document.getElementById('episodesBox');

  box.innerHTML = `<div class="episodes">${(data.episodes || []).map(ep => `
    <div class="episode">
      <img src="${ep.still_path ? IMG_BASE + ep.still_path : ''}" alt="">
      <div class="episode-info">
        <div class="episode-name">${ep.episode_number}. ${ep.name}</div>
        <div class="episode-overview">${ep.overview || 'No overview.'}</div>
      </div>
    </div>
  `).join('')}</div>`;
}

/* TIMELINE DASHBOARD (30 Dummy/Stored Entries) */
function renderTimelineDashboard() {
  const watchedBox = document.getElementById('watchedTimeline');
  const scheduledBox = document.getElementById('scheduledTimeline');

  // Generating 15 items per column (30 total entries)
  let watchedHtml = '';
  let scheduledHtml = '';

  for (let i = 1; i <= 15; i++) {
    watchedHtml += `
      <div class="timeline-card">
        <div class="timeline-card-info">
          <div class="timeline-card-title">Watched Entry #${i}</div>
          <div class="timeline-card-date">Date: 2026-08-${i < 10 ? '0'+i : i}</div>
        </div>
      </div>
    `;
    scheduledHtml += `
      <div class="timeline-card">
        <div class="timeline-card-info">
          <div class="timeline-card-title">Scheduled Entry #${i}</div>
          <div class="timeline-card-date">Scheduled: 2026-09-${i < 10 ? '0'+i : i}</div>
        </div>
      </div>
    `;
  }

  watchedBox.innerHTML = watchedHtml;
  scheduledBox.innerHTML = scheduledHtml;
}

/* RANDOM PICKER */
document.querySelectorAll('#randomType .choice').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#randomType .choice').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
  });
});

async function pickRandomItem() {
  const type = document.querySelector('#randomType .choice.active').dataset.value;
  const genre = document.getElementById('randomGenre').value;
  
  let targetType = type === 'all' ? (Math.random() > 0.5 ? 'movie' : 'tv') : type;
  let params = { page: Math.floor(Math.random() * 5) + 1 };

  if (genre === 'bollywood') {
    params.with_original_language = 'hi';
    params.with_origin_country = 'IN';
  } else if (genre) {
    params.with_genres = genre;
  }

  const data = await api(`/discover/${targetType}`, params);
  const items = data.results || [];
  if (!items.length) return;

  const picked = items[Math.floor(Math.random() * items.length)];
  currentRandomPick = { ...picked, media_type: targetType };

  document.getElementById('randomImg').src = IMG_BASE + picked.poster_path;
  document.getElementById('randomTitle').textContent = picked.title || picked.name;
  document.getElementById('randomMeta').textContent = `${targetType.toUpperCase()} • ★ ${picked.vote_average}`;
  document.getElementById('randomOverview').textContent = picked.overview;
  document.getElementById('randomResult').classList.add('show');
}

function openDetailsFromRandom() {
  if (currentRandomPick) {
    openDetails(currentRandomPick.id, currentRandomPick.media_type);
  }
}

/* INIT */
loadTrending();
loadDiscover();
</script>
</body>
</html>
