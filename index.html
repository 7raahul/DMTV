<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineVo - Movie & TV Discovery</title>
  <style>
    :root {
      --bg-main: #0f1015;
      --bg-card: #181b22;
      --bg-hover: #222631;
      --accent: #e50914;
      --imdb-yellow: #f5c518;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hidden { display: none !important; }

    /* Navigation */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(15, 16, 21, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .nav-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
    }

    .btn-pick-top {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--imdb-yellow);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-pick-top:hover {
      background: var(--bg-hover);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }

    /* Search Section */
    .search-box-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 6px;
      max-height: 350px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .suggestion-item:hover {
      background: var(--bg-hover);
    }

    .suggestion-item img {
      width: 36px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }

    /* Filters Bar */
    .filters-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }
    .filters-bar::-webkit-scrollbar { display: none; }

    .filter-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Carousels & Sections */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .carousel-container {
      position: relative;
      margin-bottom: 32px;
    }

    .carousel {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar { display: none; }

    /* Media Cards */
    .media-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      flex: 0 0 180px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.2s, border-color 0.2s;
    }

    .media-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.2);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--bg-hover);
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 700;
      color: var(--imdb-yellow);
    }

    .card-content {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Grid Layout */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    /* Details View - Split Layout without overlap */
    .page-view {
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      z-index: 1100;
      overflow-y: auto;
      display: none;
    }

    .page-view.active {
      display: block;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1200;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .details-container {
      max-width: 1300px;
      margin: 60px auto 40px auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 40px;
      align-items: start;
    }

    .details-left {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .details-right {
      position: sticky;
      top: 24px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-card);
    }

    .details-backdrop {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .details-info-pad {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-watched {
      background: #ffffff;
      color: #0f1015;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-watched.watched-active {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
    }

    /* Modal Popups for Date/Year selection */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 1300;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: var(--radius);
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-box input[type="date"] {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      outline: none;
    }

    /* Horizontal scroll lists */
    .horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .cast-card {
      flex: 0 0 100px;
      text-align: center;
    }

    .cast-card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 6px;
    }

    .cast-name {
      font-size: 11px;
      font-weight: 600;
    }

    .ott-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      text-decoration: none;
      color: #fff;
      font-size: 12px;
    }

    .ott-logo img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }

    /* Episodes Section */
    .episode-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .episode-item {
      display: flex;
      gap: 12px;
      background: var(--bg-card);
      padding: 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      align-items: center;
    }

    .episode-item img {
      width: 120px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
    }

    @media (max-width: 900px) {
      .details-container { grid-template-columns: 1fr; }
      .details-right { position: relative; top: 0; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav>
    <div class="logo" onclick="switchTab('home')">CineVo</div>
    <div class="nav-links">
      <button class="nav-link active" onclick="switchTab('home')">Home</button>
      <button class="nav-link" onclick="switchTab('search')">Search</button>
      <button class="btn-pick-top" onclick="switchTab('pick')">🎲 Pick For Me</button>
      <button class="nav-link" onclick="switchTab('journey')">Watch Journey</button>
    </div>
  </nav>

  <!-- Main Dynamic View Container -->
  <main id="appMain">
    <!-- Home Content -->
    <div id="homeView">
      <div class="search-box-wrapper">
        <input type="text" class="search-input" id="mainSearchInput" placeholder="Search movies, TV shows..." oninput="handleSearchInput(this.value)">
        <div id="searchDropdown" class="search-suggestions hidden"></div>
      </div>

      <!-- Filters -->
      <div class="filters-bar">
        <select class="filter-select" id="filterType" onchange="applyFilters()">
          <option value="all">All (Movies + TV)</option>
          <option value="movie">Movies Only</option>
          <option value="tv">TV Shows Only</option>
        </select>
        <select class="filter-select" id="filterGenre" onchange="applyFilters()">
          <option value="">All Genres</option>
        </select>
        <select class="filter-select" id="filterCountry" onchange="applyFilters()">
          <option value="">All Countries</option>
          <option value="US">United States</option>
          <option value="IN">India</option>
          <option value="GB">United Kingdom</option>
          <option value="KR">South Korea</option>
        </select>
        <select class="filter-select" id="filterYear" onchange="applyFilters()">
          <option value="">All Years</option>
        </select>
      </div>

      <!-- Filtered Results Grid -->
      <div id="filteredSection" class="hidden">
        <div class="section-title">Results</div>
        <div class="media-grid" id="filteredGrid"></div>
      </div>

      <!-- Trending Movies Carousel -->
      <div class="section-title">Trending Movies</div>
      <div class="carousel-container">
        <div class="carousel" id="trendingMoviesCarousel"></div>
      </div>

      <!-- Trending TV Shows Carousel -->
      <div class="section-title">Trending TV Shows</div>
      <div class="carousel-container">
        <div class="carousel" id="trendingTvCarousel"></div>
      </div>
    </div>

    <!-- Search View Tab -->
    <div id="searchView" class="hidden">
      <h2 style="margin-bottom: 16px;">Search Explorer</h2>
      <input type="text" class="search-input" placeholder="Type to search movies & TV..." oninput="executeFullSearch(this.value)" style="margin-bottom: 20px;">
      <div class="media-grid" id="fullSearchGrid"></div>
    </div>

    <!-- Pick For Me Tab -->
    <div id="pickView" class="hidden">
      <div style="max-width: 500px; margin: 40px auto; text-align: center; display:flex; flex-direction:column; gap:16px;">
        <h2>🎲 Pick For Me</h2>
        <p style="color:var(--text-muted); font-size:13px;">Confused what to watch? Let us randomly select a great title for you.</p>
        <div style="display:flex; gap:10px; justify-content:center;">
          <button class="btn-watched watched-active" onclick="triggerRandomPick('movie')">Pick Movie</button>
          <button class="btn-secondary" onclick="triggerRandomPick('tv')">Pick TV Show</button>
        </div>
        <div id="randomResultContainer" style="margin-top:20px;"></div>
      </div>
    </div>

    <!-- Watch Journey Tab -->
    <div id="journeyView" class="hidden">
      <h2 style="margin-bottom: 16px;">⏱️ Watch Journey</h2>
      <h3 style="font-size:15px; color:var(--text-muted); margin-bottom:10px;">Watched Items</h3>
      <div class="media-grid" id="watchedGrid"></div>
      <h3 style="font-size:15px; color:var(--text-muted); margin: 20px 0 10px;">Scheduled Items</h3>
      <div class="media-grid" id="scheduledGrid"></div>
    </div>
  </main>

  <!-- Detail Page View -->
  <div id="detailView" class="page-view">
    <button class="back-btn" onclick="closeDetails()">← Back</button>
    <div class="details-container" id="detailsContainerContent"></div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    const API_KEY = "9c95420163879f1c4726c540b305cbc6";
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_BASE = "https://image.tmdb.org/t/p/w500";
    const BACKDROP_BASE = "https://image.tmdb.org/t/p/original";

    let state = {
      activeTab: 'home',
      genres: { movie: [], tv: [] }
    };

    let currentOpenItem = null;

    async function initApp() {
      loadYears();
      fetchGenres();
      loadCarousels();
    }

    function loadYears() {
      const yearSelect = document.getElementById('filterYear');
      const currentYear = new Date().getFullYear();
      for(let y = currentYear; y >= 1970; y--) {
        yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
      }
    }

    async function fetchGenres() {
      try {
        const [mRes, tvRes] = await Promise.all([
          fetch(`${BASE_URL}/genre/movie/list?api_key=${API_KEY}`),
          fetch(`${BASE_URL}/genre/tv/list?api_key=${API_KEY}`)
        ]);
        const mData = await mRes.json();
        const tvData = await tvRes.json();
        state.genres.movie = mData.genres || [];
        state.genres.tv = tvData.genres || [];
        
        const genreSelect = document.getElementById('filterGenre');
        state.genres.movie.forEach(g => {
          genreSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`;
        });
      } catch(e) { console.error(e); }
    }

    async function loadCarousels() {
      try {
        const [mRes, tvRes] = await Promise.all([
          fetch(`${BASE_URL}/trending/movie/day?api_key=${API_KEY}`),
          fetch(`${BASE_URL}/trending/tv/day?api_key=${API_KEY}`)
        ]);
        const mData = await mRes.json();
        const tvData = await tvRes.json();

        renderCarousel(mData.results, 'trendingMoviesCarousel', 'movie');
        renderCarousel(tvData.results, 'trendingTvCarousel', 'tv');
      } catch(e) { console.error(e); }
    }

    function renderCarousel(items, containerId, mediaType) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => `
        <div class="media-card" onclick="openDetails(${item.id}, '${item.media_type || mediaType}')">
          <div class="poster-wrap">
            <img src="${item.poster_path ? IMG_BASE + item.poster_path : 'https://via.placeholder.com/180x270?text=No+Image'}" alt="poster">
            <span class="card-badge">★ ${(item.vote_average || 0).toFixed(1)}</span>
          </div>
          <div class="card-content">
            <div class="card-title">${item.title || item.name}</div>
            <div class="card-meta">
              <span>${(item.release_date || item.first_air_date || '').split('-')[0]}</span>
              <span>${(item.media_type || mediaType).toUpperCase()}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));

      if(tabId === 'home') {
        document.getElementById('homeView').classList.remove('hidden');
      } else if(tabId === 'search') {
        document.getElementById('searchView').classList.remove('hidden');
      } else if(tabId === 'pick') {
        document.getElementById('pickView').classList.remove('hidden');
      } else if(tabId === 'journey') {
        document.getElementById('journeyView').classList.remove('hidden');
        renderWatchJourney();
      }
    }

    async function handleSearchInput(query) {
      const dropdown = document.getElementById('searchDropdown');
      if(!query.trim()) {
        dropdown.classList.add('hidden');
        return;
      }
      try {
        const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        const results = (data.results || []).slice(0, 5);

        if(results.length > 0) {
          dropdown.innerHTML = results.map(item => `
            <div class="suggestion-item" onclick="openDetails(${item.id}, '${item.media_type || 'movie'}')">
              <img src="${item.poster_path ? IMG_BASE + item.poster_path : 'https://via.placeholder.com/36x50'}">
              <div>
                <div style="font-size:13px; font-weight:600;">${item.title || item.name}</div>
                <div style="font-size:11px; color:var(--text-muted);">${(item.release_date || item.first_air_date || '').split('-')[0]} • ${(item.media_type || 'movie').toUpperCase()}</div>
              </div>
            </div>
          `).join('');
          dropdown.classList.remove('hidden');
        } else {
          dropdown.classList.add('hidden');
        }
      } catch(e) { dropdown.classList.add('hidden'); }
    }

    async function applyFilters() {
      const type = document.getElementById('filterType').value;
      const genre = document.getElementById('filterGenre').value;
      const country = document.getElementById('filterCountry').value;
      const year = document.getElementById('filterYear').value;

      const filteredSection = document.getElementById('filteredSection');
      const grid = document.getElementById('filteredGrid');

      filteredSection.classList.remove('hidden');
      grid.innerHTML = '<div style="color:var(--text-muted);">Filtering...</div>';

      let endpoint = type === 'tv' ? `${BASE_URL}/discover/tv` : `${BASE_URL}/discover/movie`;
      if(type === 'all') endpoint = `${BASE_URL}/discover/movie`;

      let url = `${endpoint}?api_key=${API_KEY}`;
      if(genre) url += `&with_genres=${genre}`;
      if(country) url += `&with_origin_country=${country}`;
      if(year) url += `&primary_release_year=${year}&first_air_date_year=${year}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const results = data.results || [];
        
        grid.innerHTML = results.length ? results.map(item => `
          <div class="media-card" onclick="openDetails(${item.id}, '${type === 'tv' ? 'tv' : 'movie'}')">
            <div class="poster-wrap">
              <img src="${item.poster_path ? IMG_BASE + item.poster_path : 'https://via.placeholder.com/180x270'}">
              <span class="card-badge">★ ${(item.vote_average || 0).toFixed(1)}</span>
            </div>
            <div class="card-content">
              <div class="card-title">${item.title || item.name}</div>
              <div class="card-meta">
                <span>${(item.release_date || item.first_air_date || '').split('-')[0]}</span>
              </div>
            </div>
          </div>
        `).join('') : '<div style="color:var(--text-muted);">No results found.</div>';
      } catch(e) { grid.innerHTML = 'Error loading filter results.'; }
    }

    async function executeFullSearch(query) {
      const grid = document.getElementById('fullSearchGrid');
      if(!query.trim()) { grid.innerHTML = ''; return; }
      try {
        const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        grid.innerHTML = (data.results || []).map(item => `
          <div class="media-card" onclick="openDetails(${item.id}, '${item.media_type || 'movie'}')">
            <div class="poster-wrap">
              <img src="${item.poster_path ? IMG_BASE + item.poster_path : 'https://via.placeholder.com/180x270'}">
              <span class="card-badge">★ ${(item.vote_average || 0).toFixed(1)}</span>
            </div>
            <div class="card-content">
              <div class="card-title">${item.title || item.name}</div>
              <div class="card-meta">
                <span>${(item.media_type || 'movie').toUpperCase()}</span>
              </div>
            </div>
          </div>
        `).join('');
      } catch(e) {}
    }

    async function triggerRandomPick(mediaType) {
      const container = document.getElementById('randomResultContainer');
      container.innerHTML = 'Picking random title...';
      try {
        const randomPage = Math.floor(Math.random() * 5) + 1;
        const res = await fetch(`${BASE_URL}/${mediaType}/popular?api_key=${API_KEY}&page=${randomPage}`);
        const data = await res.json();
        const items = data.results || [];
        if(items.length === 0) return;
        const randomItem = items[Math.floor(Math.random() * items.length)];

        container.innerHTML = `
          <div class="media-card" style="max-width:220px; margin:0 auto;" onclick="openDetails(${randomItem.id}, '${mediaType}')">
            <div class="poster-wrap">
              <img src="${IMG_BASE + randomItem.poster_path}">
              <span class="card-badge">★ ${randomItem.vote_average.toFixed(1)}</span>
            </div>
            <div class="card-content">
              <div class="card-title">${randomItem.title || randomItem.name}</div>
              <div style="font-size:11px; color:var(--text-muted); text-align:left; margin-top:4px;">${randomItem.overview.slice(0, 60)}...</div>
            </div>
          </div>
        `;
      } catch(e) { container.innerHTML = 'Failed to pick.'; }
    }

    async function openDetails(id, mediaType) {
      const view = document.getElementById('detailView');
      view.classList.add('active');
      const container = document.getElementById('detailsContainerContent');

      container.innerHTML = '<div style="color:var(--text-muted);">Loading full details...</div>';

      try {
        const [detailRes, creditsRes, ottRes, recRes] = await Promise.all([
          fetch(`${BASE_URL}/${mediaType}/${id}?api_key=${API_KEY}`),
          fetch(`${BASE_URL}/${mediaType}/${id}/credits?api_key=${API_KEY}`),
          fetch(`${BASE_URL}/${mediaType}/${id}/watch/providers?api_key=${API_KEY}`),
          fetch(`${BASE_URL}/${mediaType}/${id}/similar?api_key=${API_KEY}`)
        ]);

        const detail = await detailRes.json();
        const credits = await creditsRes.json();
        const ottData = await ottRes.json();
        const recData = await recRes.json();

        currentOpenItem = { id, title: detail.title || detail.name, poster: detail.poster_path, type: mediaType };

        let ottProviders = [];
        if(ottData.results && ottData.results.IN) {
          ottProviders = ottData.results.IN.flatrate || ottData.results.IN.rent || [];
        }

        let isWatched = checkIfWatched(id);

        container.innerHTML = `
          <div class="details-left">
            <div>
              <h1 style="font-size: 26px; font-weight:800; margin-bottom:6px;">${detail.title || detail.name}</h1>
              <div style="font-size: 13px; color: var(--text-muted); display:flex; gap:10px; align-items:center;">
                <span>📅 Released: ${detail.release_date || detail.first_air_date || 'N/A'}</span>
                <span>★ <strong style="color:var(--imdb-yellow);">${(detail.vote_average || 0).toFixed(1)}</strong></span>
                <span>⏱️ ${detail.runtime ? detail.runtime + ' mins' : mediaType.toUpperCase()}</span>
              </div>
            </div>

            <div class="action-row">
              <button class="btn-watched ${isWatched ? 'watched-active' : ''}" id="watchedBtnMain" onclick="handleWatchedClick()">✓ ${isWatched ? 'Watched' : 'Mark Watched'}</button>
              <button class="btn-secondary" onclick="handleScheduleClick()">📅 Schedule Watch</button>
            </div>

            <div>
              <h3 style="font-size:15px; margin-bottom:8px;">Overview</h3>
              <p style="font-size:13px; color:var(--text-muted); line-height:1.6;">${detail.overview || 'No overview available.'}</p>
            </div>

            ${ottProviders.length ? `
              <div>
                <h3 style="font-size:15px; margin-bottom:8px;">Where to Watch (OTT)</h3>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                  ${ottProviders.map(p => `<a href="${ottData.results.IN.link || '#'}" target="_blank" class="ott-logo"><img src="${IMG_BASE + p.logo_path}">${p.provider_name}</a>`).join('')}
                </div>
              </div>
            ` : ''}

            <div>
              <h3 style="font-size:15px; margin-bottom:8px;">Top Cast</h3>
              <div class="horizontal-scroll">
                ${(credits.cast || []).slice(0, 10).map(c => `
                  <div class="cast-card">
                    <img src="${c.profile_path ? IMG_BASE + c.profile_path : 'https://via.placeholder.com/100'}">
                    <div class="cast-name">${c.name}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            ${mediaType === 'tv' ? `<div id="tvSeasonsContainer"></div>` : ''}

            <div>
              <h3 style="font-size:15px; margin-bottom:8px;">Related / Recommendations</h3>
              <div class="horizontal-scroll">
                ${(recData.results || []).slice(0, 8).map(item => `
                  <div class="media-card" style="flex:0 0 140px;" onclick="openDetails(${item.id}, '${mediaType}')">
                    <div class="poster-wrap" style="aspect-ratio:2/3;">
                      <img src="${item.poster_path ? IMG_BASE + item.poster_path : 'https://via.placeholder.com/140x210'}">
                      <span class="card-badge">★ ${(item.vote_average || 0).toFixed(1)}</span>
                    </div>
                    <div class="card-content">
                      <div class="card-title">${item.title || item.name}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="details-right">
            <img class="details-backdrop" src="${detail.backdrop_path ? BACKDROP_BASE + detail.backdrop_path : 'https://via.placeholder.com/380x240'}">
            <div class="details-info-pad">
              <div style="font-size:12px; color:var(--text-muted)">Genres: ${(detail.genres || []).map(g => g.name).join(', ')}</div>
              <div style="font-size:12px; color:var(--text-muted)">Status: ${detail.status || 'Released'}</div>
              <div style="font-size:12px; color:var(--text-muted)">Original Language: ${(detail.original_language || '').toUpperCase()}</div>
            </div>
          </div>
        `;

        if(mediaType === 'tv' && detail.seasons) {
          loadTvSeasons(id, detail.seasons);
        }

      } catch(e) { container.innerHTML = 'Error loading details.'; }
    }

    async function loadTvSeasons(tvId, seasons) {
      // filter out season 0 if considered specials, or keep regular seasons cleanly
      const regularSeasons = seasons.filter(s => s.season_number > 0);
      const container = document.getElementById('tvSeasonsContainer');
      container.innerHTML = `
        <h3 style="font-size:15px; margin-bottom:8px;">Seasons & Episodes</h3>
        <select class="filter-select" id="seasonSelect" onchange="fetchSeasonEpisodes(${tvId}, this.value)" style="margin-bottom:12px;">
          ${regularSeasons.map(s => `<option value="${s.season_number}">Season ${s.season_number} (${s.episode_count} eps)</option>`).join('')}
        </select>
        <div class="episode-list" id="episodeListContainer"></div>
      `;
      if(regularSeasons.length > 0) fetchSeasonEpisodes(tvId, regularSeasons[0].season_number);
    }

    async function fetchSeasonEpisodes(tvId, seasonNum) {
      const container = document.getElementById('episodeListContainer');
      container.innerHTML = 'Loading episodes...';
      try {
        const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${seasonNum}?api_key=${API_KEY}`);
        const data = await res.json();
        container.innerHTML = (data.episodes || []).map(ep => `
          <div class="episode-item">
            <img src="${ep.still_path ? IMG_BASE + ep.still_path : 'https://via.placeholder.com/120x70'}">
            <div style="flex-grow:1;">
              <div style="font-size:13px; font-weight:600;">E${ep.episode_number}. ${ep.name}</div>
              <div style="font-size:11px; color:var(--text-muted); margin:2px 0;">
                📅 ${ep.air_date || 'N/A'} &nbsp;|&nbsp; 
                ★ <strong style="color:var(--imdb-yellow);">${(ep.vote_average || 0).toFixed(1)}</strong>
              </div>
              <div style="font-size:11px; color:var(--text-muted);">${(ep.overview || '').slice(0, 90)}...</div>
            </div>
          </div>
        `).join('');
      } catch(e) { container.innerHTML = 'Could not load episodes.'; }
    }

    function closeDetails() {
      document.getElementById('detailView').classList.remove('active');
    }

    function checkIfWatched(id) {
      let watched = JSON.parse(localStorage.getItem('cinevo_watched') || '[]');
      return watched.some(i => i.id === id);
    }

    function handleWatchedClick() {
      const modalHtml = `
        <div class="modal-overlay" id="dateModal">
          <div class="modal-box">
            <h3>Select Watch Date</h3>
            <input type="date" id="selectedDateInput" value="${new Date().toISOString().split('T')[0]}">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
              <button class="btn-secondary" onclick="document.getElementById('dateModal').remove()">Cancel</button>
              <button class="btn-watched watched-active" onclick="confirmMarkWatched()">Save</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function confirmMarkWatched() {
      const dateVal = document.getElementById('selectedDateInput').value;
      let watched = JSON.parse(localStorage.getItem('cinevo_watched') || '[]');
      if(!watched.some(i => i.id === currentOpenItem.id)) {
        watched.push({...currentOpenItem, date: dateVal});
        localStorage.setItem('cinevo_watched', JSON.stringify(watched));
      }
      document.getElementById('dateModal').remove();
      const btn = document.getElementById('watchedBtnMain');
      if(btn) {
        btn.classList.add('watched-active');
        btn.textContent = '✓ Watched';
      }
    }

    function handleScheduleClick() {
      const modalHtml = `
        <div class="modal-overlay" id="scheduleModal">
          <div class="modal-box">
            <h3>Schedule Watch Date</h3>
            <input type="date" id="selectedScheduleInput" value="${new Date().toISOString().split('T')[0]}">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
              <button class="btn-secondary" onclick="document.getElementById('scheduleModal').remove()">Cancel</button>
              <button class="btn-watched watched-active" onclick="confirmSchedule()">Schedule</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function confirmSchedule() {
      const dateVal = document.getElementById('selectedScheduleInput').value;
      let scheduled = JSON.parse(localStorage.getItem('cinevo_scheduled') || '[]');
      if(!scheduled.some(i => i.id === currentOpenItem.id)) {
        scheduled.push({...currentOpenItem, date: dateVal});
        localStorage.setItem('cinevo_scheduled', JSON.stringify(scheduled));
      }
      document.getElementById('scheduleModal').remove();
      alert('Successfully scheduled!');
    }

    function renderWatchJourney() {
      const watched = JSON.parse(localStorage.getItem('cinevo_watched') || '[]');
      const scheduled = JSON.parse(localStorage.getItem('cinevo_scheduled') || '[]');

      document.getElementById('watchedGrid').innerHTML = watched.length ? watched.map(i => `
        <div class="media-card" onclick="openDetails(${i.id}, '${i.type}')">
          <div class="poster-wrap"><img src="${IMG_BASE + i.poster}"></div>
          <div class="card-content"><div class="card-title">${i.title}</div><div class="card-meta">Watched: ${i.date}</div></div>
        </div>
      `).join('') : '<div style="color:var(--text-muted); font-size:12px;">No watched items yet.</div>';

      document.getElementById('scheduledGrid').innerHTML = scheduled.length ? scheduled.map(i => `
        <div class="media-card" onclick="openDetails(${i.id}, '${i.type}')">
          <div class="poster-wrap"><img src="${IMG_BASE + i.poster}"></div>
          <div class="card-content"><div class="card-title">${i.title}</div><div class="card-meta">Date: ${i.date}</div></div>
        </div>
      `).join('') : '<div style="color:var(--text-muted); font-size:12px;">No scheduled items.</div>';
    }

    window.onload = initApp;
  </script>
</body>
</html>
